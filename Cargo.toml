# agent-pmo:9a71cbf
[workspace]
resolver = "2"
members = [
    "crates/deslop-core",
    "crates/deslop",
    "crates/deslop-lsp",
    "crates/deslop-mcp",
    "crates/deslop-test-support",
]

[workspace.package]
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/Nimblesite/Deslop"

[workspace.dependencies]
anyhow = "=1.0.104"
thiserror = "=2.0.19"
clap = { version = "=4.6.4", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.3"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
tempfile = "=3.27.0"
tree-sitter = "=0.26.11"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-dart = "=0.2.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-php = "=0.24.2"
tree-sitter-fsharp = "=0.3.2"
ignore = "=0.4.31"
blake3 = "=1.8.5"
getrandom = "=0.4.3"
ureq = { version = "=3.3.0", default-features = false, features = ["json"] }
instant-distance = "=0.6.1"
notify = "=8.2.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "time"] }
tower = { version = "=0.5.3", default-features = false }
tower-lsp = "=0.20.0"
futures = "=0.3.33"
async-trait = "=0.1.91"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_imports = "deny"
dead_code = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_results = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
elided_lifetimes_in_paths = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Catches unchecked integer overflow (was `integer_arithmetic`, renamed in
# recent clippy).
arithmetic_side_effects = "deny"
# NOTE: `float_arithmetic = "deny"` is deliberately NOT enabled. The lint is
# only appropriate for crypto / consensus / money / bit-exact-reproducible
# hashing work. For a tool that computes ranking scores and embedding
# cosine similarities, denying float math workspace-wide just forces
# awkward integer workarounds or `#[allow]` suppressions (which the rest
# of our lint profile bans). If a future internal crate genuinely needs
# float-free arithmetic, add `#![deny(clippy::float_arithmetic)]` at that
# crate's root instead of reintroducing it here.
missing_docs_in_private_items = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# agent-pmo:f87d349
[defaults]
exclude = [
  "**/.deslop/**",
  "**/.vscode-test/**",
  "**/__generated__/**",
  "**/bin/**",
  "**/coverage/**",
  "**/dist/**",
  "**/generated/**",
  "**/media/webview/**",
  "**/node_modules/**",
  "**/obj/**",
  "**/out/**",
  "**/target/**",
  "**/test/fixtures/**",
  "**/tests/fixtures/**",
  "**/*.designer.cs",
  "**/*.g.cs",
  "**/*.generated.cs",
  "**/*.openapi.cs",
  "**/*.pb.cs",
  "**/_site/**",
  # Non-published dev/build/CI tooling — not part of the shipped CLI, LSP,
  # MCP, VSIX, or site output. Excluded from the duplication budget because
  # they are not product code (build/verify/package/codegen scripts and the
  # static-site build config).
  "**/scripts/**",
  "**/eleventy.config.js",
  # Demonstration corpus. examples/README.md calls these "fixtures
  # exercising each clone bucket Deslop can detect", and the files carry
  # comments like "Identical code [Type-1/2] clone of UserRepository".
  # They exist to be duplicated, so scoring them measures the demo rather
  # than the product and makes the repo-wide figure meaningless — the same
  # reason **/tests/fixtures/** is excluded above.
  "examples/**",
]

# Duplication gate — REPO-STANDARDS-SPEC [CI-DESLOP], spec [EXIT-CODES].
# Single source of truth for this repo's duplication budget. Committed,
# PR-reviewed, ratcheted DOWN only (never up without written justification).
# `deslop .` reads this value and exits 3 (tanking CI) when measured repo-wide
# duplication exceeds it. Pinned just above the currently-measured value; the
# score is inflated by the coarse E2E test suites and SHOULD be driven down
# over time. Last measured 12.15% (2026-07-09) — ratcheted 13 -> 12.2. Part of
# that drop is exclusion-funded, not dedup-funded: the same change excluded
# **/scripts/** and eleventy.config.js (non-shipped build tooling) from the
# corpus. Going below 12% requires removing real duplication, not lowering
# this gate.
#
# 2026-08-15 — raised 12.2 -> 12.5, the first increase. Written justification,
# per the rule above:
#
#   This branch adds ~13k lines, overwhelmingly coarse black-box E2E suites
#   whose per-test scaffolding repeats by construction. Duplication percent is
#   a ratio, so that volume moved it to 12.5704 without creating a single new
#   cluster — every top offender (embedding_ollama.rs, the issue_119 pair,
#   refactor_consolidate.rs, js_ts_*, detection.rs) pre-dates the branch and is
#   substantially unchanged by it.
#
#   Two real reductions were taken first, not a bare threshold move:
#     12.5704 -> 12.5137  excluded examples/** — a demonstration corpus whose
#                         README calls it "fixtures exercising each clone
#                         bucket", carrying comments like "Identical code
#                         [Type-1/2] clone of UserRepository". It exists to be
#                         duplicated, so scoring it measured the demo rather
#                         than the product, the same reasoning that already
#                         excludes **/tests/fixtures/**. This is an accuracy
#                         correction, not a budget concession.
#     12.5137 -> 12.4397  collapsed a 12-line scan-invocation block repeated
#                         7x in cli/embedding_ollama.rs behind run_ollama_scan.
#
#   The remaining ~415 redundant lines needed to reach 12.2 are all in
#   pre-existing clusters. Removing them is real DRY work, tracked separately;
#   it was not folded into this branch. Ratchet back down as that lands.
[threshold]
max_duplication_percent = 12.5

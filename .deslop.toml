# agent-pmo:f87d349
[defaults]
exclude = [
  "**/.deslop/**",
  "**/.vscode-test/**",
  "**/__generated__/**",
  "**/bin/**",
  "**/coverage/**",
  "**/dist/**",
  "**/generated/**",
  "**/media/webview/**",
  "**/node_modules/**",
  "**/obj/**",
  "**/out/**",
  "**/target/**",
  "**/test/fixtures/**",
  "**/tests/fixtures/**",
  "**/*.designer.cs",
  "**/*.g.cs",
  "**/*.generated.cs",
  "**/*.openapi.cs",
  "**/*.pb.cs",
  "**/_site/**",
  # Non-published dev/build/CI tooling — not part of the shipped CLI, LSP,
  # MCP, VSIX, or site output. Excluded from the duplication budget because
  # they are not product code (build/verify/package/codegen scripts and the
  # static-site build config).
  "**/scripts/**",
  "**/eleventy.config.js",
  # Demonstration corpus. examples/README.md calls these "fixtures
  # exercising each clone bucket Deslop can detect", and the files carry
  # comments like "Identical code [Type-1/2] clone of UserRepository".
  # They exist to be duplicated, so scoring them measures the demo rather
  # than the product and makes the repo-wide figure meaningless — the same
  # reason **/tests/fixtures/** is excluded above.
  "examples/**",
]

# Duplication gate — REPO-STANDARDS-SPEC [CI-DESLOP], spec [EXIT-CODES].
# Single source of truth for this repo's duplication budget. Committed,
# PR-reviewed, ratcheted DOWN only (never up without written justification).
# `deslop .` reads this value and exits 3 (tanking CI) when measured repo-wide
# duplication exceeds it. Pinned just above the currently-measured value; the
# score is inflated by the coarse E2E test suites and SHOULD be driven down
# over time. Last measured 12.15% (2026-07-09) — ratcheted 13 -> 12.2. Part of
# that drop is exclusion-funded, not dedup-funded: the same change excluded
# **/scripts/** and eleventy.config.js (non-shipped build tooling) from the
# corpus. Going below 12% requires removing real duplication, not lowering
# this gate.
#
# 2026-08-15 — raised 12.2 -> 12.5, the first increase. Written justification,
# per the rule above:
#
#   This branch adds ~13k lines, overwhelmingly coarse black-box E2E suites
#   whose per-test scaffolding repeats by construction. Duplication percent is
#   a ratio, so that volume moved it to 12.5704 without creating a single new
#   cluster — every top offender (embedding_ollama.rs, the issue_119 pair,
#   refactor_consolidate.rs, js_ts_*, detection.rs) pre-dates the branch and is
#   substantially unchanged by it.
#
#   Two real reductions were taken first, not a bare threshold move:
#     12.5704 -> 12.5137  excluded examples/** — a demonstration corpus whose
#                         README calls it "fixtures exercising each clone
#                         bucket", carrying comments like "Identical code
#                         [Type-1/2] clone of UserRepository". It exists to be
#                         duplicated, so scoring it measured the demo rather
#                         than the product, the same reasoning that already
#                         excludes **/tests/fixtures/**. This is an accuracy
#                         correction, not a budget concession.
#     12.5137 -> 12.4397  collapsed a 12-line scan-invocation block repeated
#                         7x in cli/embedding_ollama.rs behind run_ollama_scan.
#
#   The remaining ~415 redundant lines needed to reach 12.2 are all in
#   pre-existing clusters. Removing them is real DRY work, tracked separately;
#   it was not folded into this branch. Ratchet back down as that lands.
#
# 2026-08-17 — raised 12.5 -> 13.65. Written justification, per the rule above.
# This one is different in kind from the last: **the detector changed, the code
# did not.** 12.5 was calibrated against a detector carrying a false negative.
#
#   [CLONE-BUCKETS-ROUTING] row 4 (`structural <= 0.01 & token_jaccard >= 0.90
#   -> nearly_identical`) was implemented for C# only, via a carve-out in
#   report_render. Every other language's LSH-only Type-3 clone fell to
#   `loosely_similar`, which the renderer hides — so real duplication in this
#   repo's own Rust, TypeScript, Python and Dart was measured as zero (gh #390).
#   Row 4 now routes in every language, and this repo's own duplication is
#   therefore measured higher than it used to be. Nothing was duplicated to
#   cause it; it was always there and the gate could not see it.
#
#   Measured with one binary (the corrected one) against both trees, so the
#   comparison isolates the code from the detector:
#     main @ 5813c795c   13.9514%   13504 redundant LOC / 876 clusters
#     this branch        13.6160%   14052 redundant LOC / 913 clusters
#   The branch is 0.335 points *below* main under the same detector, even while
#   adding ~6.4k lines of coarse E2E suites. It removes duplication; the number
#   went up because the measurement got honest.
#
#   Real reduction taken first, not a bare threshold move:
#     13.6447 -> 13.6160  collapsed the byte-offset-preserving edit helper
#                         duplicated between cache_retention.rs and
#                         lsh_only_nearmiss_recall.rs behind one
#                         `incremental::edit_preserving_offsets`. Deslop scored
#                         it `nearly_identical, fused 0.90` — above the act-now
#                         line — and it was written twice on this branch, so it
#                         is the branch's own debt and it is paid here.
#
#   Pinned just above the measured 13.6160. The ~1.1 points between here and
#   12.5 are pre-existing clusters the old router hid, concentrated in
#   deslop-mcp/tests/cli.rs (591 LOC), the vscode unit suites (~1.1k LOC across
#   five files), defaults.rs (310) and refactor_consolidate.rs (292) — none of
#   them touched by this branch. That is real DRY work, tracked in gh #397; the
#   one thing it must NOT be paid for with is re-hiding the clusters, which is
#   what lowering row 4 back to a C#-only carve-out would do.
#   Ratchet down as that work lands.
#
# 2026-08-18 — raised 13.65 -> 14.5. Written justification, per the rule above.
# Same shape as the entry before it: the detector moved again, and 13.65 was
# pinned against a tree and a binary that no longer exist.
#
#   Measured with ONE binary against three trees, so the comparison isolates
#   the code from the detector:
#     branch point fb142e993   15.5198%   15571 redundant LOC
#     main                     15.1780%   15664 redundant LOC
#     this branch (HEAD)       15.1466%   16177 redundant LOC
#   The branch is the LEAST duplicated of the three. Measured instead with
#   main's own binary against main's own tree, main scores 15.4249% — main
#   does not pass this gate either, so 13.65 was unreachable by any tree in
#   this comparison, not merely by this branch.
#
#   Real reduction taken first, not a bare threshold move, and taken inside
#   this branch's own diff per the rule that a branch pays its own debt:
#     collapsed MULTILANG_CASES in tests/common/multilang.rs from six 9-line
#     struct literals to six `LangCase::row(..)` calls. Deslop scored the six
#     blocks `structural_only`, 45 redundant LOC. Every pinned span, cluster
#     id and node count survives verbatim, so the golden contract is untouched.
#
#   Pinned at 14.5, below main's own 15.4249, so the gate still holds this
#   branch to a standard main itself fails. The remaining distance is
#   pre-existing clusters in the coarse E2E suites — a flat tail, largest
#   single cluster 94 LOC of 16177 across ~1130 clusters — tracked in gh #397.
#   Ratchet down as that work lands.
[threshold]
max_duplication_percent = 14.5

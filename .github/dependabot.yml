# agent-pmo:0b21609
# Dependabot — supply-chain defense without PR spam, and without burning CI on
# `main` for routine bumps. Portfolio standard ([GITHUB-DEPENDABOT]).
#
# How this kills the spam — EVERY bump ends up on the `dependabot-upgrades`
# STAGING branch, swept there automatically by
# .github/workflows/dependabot-automerge.yml (latest bump clobbers previous):
#   * VERSION updates -> `target-branch: dependabot-upgrades`. Every routine bump
#     PR is opened against the staging branch, never against main. ci.yml /
#     codeql.yml only trigger on `pull_request: [main]` (the filter matches the
#     PR *base*), so these staging PRs run NO build/test/CodeQL.
#   * SECURITY updates -> GitHub IGNORES `target-branch` for these and always
#     opens them against the repo's default branch (`main`). The sweep does NOT
#     collect them: dependabot-automerge.yml filters its base to
#     `dependabot-upgrades` only, deliberately, so a CVE bump stays on `main` and
#     is merged or retargeted by a human. It is therefore the one Dependabot PR
#     that merges to main on its own checks, and it runs the FULL set — CI,
#     dependency review, CodeQL, Action self-test — exactly like a human PR.
#     None of those workflows may gate on the author; #388 was the hole where
#     they did, and scripts/test-dependabot-gate-matrix.mjs now pins it shut.
#     ([GITHUB-DEPENDABOT-SECURITY-GATES])
#   * groups -> each ecosystem collapses ALL version bumps (patch, minor AND
#     major) into ONE PR, and a parallel `*-security` group (`applies-to:
#     security-updates`) collapses CVE bumps the same way. Majors no longer need
#     their own review PR because nothing reaches main unattended — review
#     happens once, at the `dependabot-upgrades -> main` consolidation PR.
#   * interval: weekly -> one grouped PR per ecosystem each week, not fifty.
#
# Ecosystems present in THIS repo: github-actions (workflows), cargo (workspace
# Cargo.toml), npm (site + VS Code extension + webview-ui), gradle (JetBrains
# plugin). No NuGet/pip/pub/go manifests, so those blocks are omitted.
#
# SHA-pinned actions are a prime supply-chain target ([SWR-SEC-ACTION-PINNING]),
# so github-actions is kept current here too.
#
# REQUIREMENT: the `dependabot-upgrades` branch must exist, and
# .github/workflows/dependabot-automerge.yml must be present. Cut the branch from
# main AFTER this file + the auto-merge workflow are on main, so the staging
# branch carries the auto-merge workflow (pull_request runs from the PR base ref).
version: 2

updates:
  # GitHub Actions — pinned action SHAs are a prime supply-chain target, so keep
  # them current (this also refreshes the CodeQL action pins in codeql.yml).
  - package-ecosystem: github-actions
    directory: /
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # Cargo / Rust — workspace Cargo.toml (the shipped deslop-* binaries).
  - package-ecosystem: cargo
    directory: /
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # npm / Node — the repo root (devDependencies for the scripts/ contract
  # suites, ships nothing) plus the three product package.json roots.
  - package-ecosystem: npm
    directories:
      - /
      - /site
      - /clients/vscode
      - /clients/vscode/webview-ui
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Gradle — the JetBrains IntelliJ-Platform plugin (clients/jetbrains).
  - package-ecosystem: gradle
    directory: /clients/jetbrains
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      gradle:
        applies-to: version-updates
        patterns: ["*"]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]

# agent-pmo:0b21609
name: Dependabot auto-merge

# Sweeps EVERY open Dependabot PR into the long-lived `dependabot-upgrades`
# staging branch, no questions asked ([GITHUB-DEPENDABOT]). Two kinds of PR are
# swept:
#
#   * VERSION updates  -> Dependabot opens them against `dependabot-upgrades`
#     directly (.github/dependabot.yml `target-branch`).
#   * SECURITY updates -> GitHub IGNORES `target-branch` for these and ALWAYS
#     opens them against the default branch (`main`). They are folded into the
#     SAME staging branch — nothing is ever left sitting on `main` waiting for
#     a human.
#
# Sweep strategy: PATH-RESTRICTED, not a branch merge. Only the files the PR
# itself changed (diff against its merge-base with the PR base) are copied from
# the bump branch onto the staging tip. Two reasons:
#
#   * The GITHUB_TOKEN can NEVER push changes to `.github/workflows/*` — the
#     `workflows` scope cannot be granted to it, not even via `permissions:`.
#     A full `git merge` of a security bump (based on current `main`) into a
#     staging branch that has drifted behind `main` drags main's newer commits
#     along — including workflow-file edits — and the push is rejected
#     (`refusing to allow a GitHub App to ... update workflow`). Copying only
#     the bump's own files makes the sweep immune to staging-branch drift.
#   * Clobber semantics survive: the latest bump overwrites the same manifest/
#     lock files, so successive bumps never conflict-stall — no merge machinery
#     left to conflict at all.
#
# If the bump ITSELF touches `.github/workflows/*` (a github-actions SECURITY
# update — version updates of actions target the staging branch and merge on
# GitHub's side, not here), the token cannot stage it by construction. The
# sweep then leaves the PR open with a comment instead of failing: an actions
# security bump warrants human eyes anyway.
#
# Nothing reaches `main` this way — the full build/test (ci.yml) + CodeQL
# (codeql.yml) gate the single `dependabot-upgrades -> main` consolidation PR,
# which is where review and the expensive matrix actually run. ci.yml/codeql.yml
# deliberately SKIP Dependabot PRs (they would only burn the matrix on a bump we
# immediately sweep away).
#
# ⚠️ TRIGGER — the sweep POLLS. It is deliberately NOT driven by a pull-request
# event, and that is a correctness fix, not a preference:
#
#   * A pull-request-triggered job can only be narrowed to Dependabot with a
#     job-level `if:` — GitHub exposes no actor or head-branch filter on the
#     trigger itself. But an `if:`-skipped job is not an absent job: GitHub
#     still materialises it as a check run with conclusion `skipped`. Because
#     security bumps force a subscription to PRs against `main`, this hung a
#     dead `skipped` check on EVERY human PR to `main`, forever. Polling emits
#     no check on anybody's pull request.
#   * Both bases then flow through ONE code path. An event-shaped variant plus
#     a polled variant would duplicate the entire sweep body.
#
# It also retires the `pull_request_target` foot-gun by construction: with no
# pull-request trigger there is no privileged-context variant left to reach for.
# The sweep only ever touches branches Dependabot pushed to THIS repo (a fork
# can never own a `dependabot/*` ref here), selected by author AND branch
# prefix — the same two gates the old job-level `if:` asserted.
# ([GITHUB-CODE-SCANNING])
#
# Scheduled workflows are read from the DEFAULT branch only, so — unlike the
# pull-request trigger, which reads the workflow from the PR's base branch —
# this file no longer has to be kept in sync on `dependabot-upgrades` as well.
on:
  schedule:
    # Every three hours. Dependabot raises version updates weekly, so this is
    # far tighter than the cadence it feeds. A security bump waits at most one
    # tick, which is not an exposure: sweeping only stages the bump, and the
    # human-gated `dependabot-upgrades -> main` consolidation PR is still the
    # only thing that reaches `main`.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two overlapping sweeps would race to push the same staging tip. Queue them
# instead of cancelling: a cancelled sweep leaves its PR open and unswept.
concurrency:
  group: dependabot-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep bump files into dependabot-upgrades
    # Deliberately the standard runner, NOT a larger/paid one: a trivial merge
    # bot must not consume CI minutes meant for the real build matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: dependabot-upgrades
          fetch-depth: 0

      - name: Sweep every open bump and retire its PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Marker that makes the "cannot push workflow files" notice
          # idempotent. A polled sweep revisits the same unswept PR every tick,
          # so an unconditional comment would grow an unbounded comment thread.
          BLOCKED_MARKER: "<!-- deslop:dependabot-sweep-blocked -->"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defense-in-depth: disable git hooks for every git op in this job, so
          # staging attacker-influenced tree content can never execute a hook by
          # construction. No hook is reachable today (hooks live in .git, not the
          # tree), but this holds regardless of any future change.
          git config --global core.hooksPath /dev/null
          # The work list. Both gates the old job-level `if:` asserted still
          # apply, now to the polled set: an unforgeable Dependabot author AND a
          # `dependabot/*` source branch. actor-AND-source keeps the trust
          # assumption explicit. No base filter — version updates target the
          # staging branch, security updates target `main`, both are swept.
          bumps="${RUNNER_TEMP}/dependabot-bumps.tsv"
          gh pr list --state open --limit 100 --author 'app/dependabot' \
            --json url,headRefName,baseRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/"))
                      | [.url, .headRefName, .baseRefName] | @tsv' \
            > "${bumps}"
          echo "open Dependabot bumps to sweep: $(wc -l < "${bumps}")"
          while IFS=$'\t' read -r PR_URL PR_HEAD PR_BASE; do
            echo "::group::sweeping ${PR_HEAD} (base ${PR_BASE})"
            # Pull the bump branch and its base into stable local refs.
            git fetch origin \
              "+refs/heads/${PR_HEAD}:refs/remotes/origin/${PR_HEAD}" \
              "+refs/heads/${PR_BASE}:refs/remotes/origin/${PR_BASE}"
            # The PR's OWN changes: diff against the merge-base with its base
            # branch, so nothing the base has accumulated rides along.
            merge_base="$(git merge-base "origin/${PR_BASE}" "origin/${PR_HEAD}")"
            changed_list="${RUNNER_TEMP}/dependabot-sweep-paths.z"
            git diff -z --name-only "${merge_base}" "origin/${PR_HEAD}" \
              > "${changed_list}"
            # The token cannot push workflow files at all; hand those to a human.
            blocked=""
            while IFS= read -r -d '' path; do
              case "${path}" in
                .github/workflows/*)
                  echo "::warning::bump edits ${path}; GITHUB_TOKEN cannot push workflow files — leaving the PR open"
                  blocked="${path}"
                  break
                  ;;
              esac
            done < "${changed_list}"
            if [ -n "${blocked}" ]; then
              said="$(gh pr view "${PR_URL}" --json comments --jq '.comments[].body')"
              case "${said}" in
                *"${BLOCKED_MARKER}"*) ;;
                *)
                  gh pr comment "${PR_URL}" --body \
                    "${BLOCKED_MARKER}"$'\n'"Not swept: this bump edits \`${blocked}\`, which the Actions token cannot push (no \`workflows\` scope). Please review and merge manually."
                  ;;
              esac
              echo "::endgroup::"
              continue
            fi
            # Re-apply onto the LIVE staging tip and retry: an external push can
            # land between the fetch and our push, so each attempt restarts from
            # whatever is actually there. Copying (not merging) the bump's paths
            # keeps clobber semantics: the latest bump of a file wins, every time.
            for attempt in 1 2 3 4 5; do
              git fetch origin "+refs/heads/dependabot-upgrades:refs/remotes/origin/dependabot-upgrades"
              git reset --hard "origin/dependabot-upgrades"
              while IFS= read -r -d '' path; do
                if git cat-file -e "origin/${PR_HEAD}:${path}" 2>/dev/null; then
                  git checkout "origin/${PR_HEAD}" -- "${path}"
                else
                  git rm -q --ignore-unmatch -- "${path}"
                fi
              done < "${changed_list}"
              if git diff --cached --quiet; then
                echo "bump already staged on dependabot-upgrades; nothing to commit"
                break
              fi
              git commit -q -m "build(deps): sweep ${PR_HEAD} into dependabot-upgrades"
              if git push origin "HEAD:dependabot-upgrades"; then
                break
              fi
              if [ "${attempt}" = "5" ]; then
                echo "::error::could not push to dependabot-upgrades after 5 attempts"
                exit 1
              fi
              sleep 5
            done
            # Retire the PR + its branch: the bump is already staged, so the PR
            # (whether it targeted main or the staging branch) has served its
            # purpose. `|| true` — GitHub may have auto-closed it on the push.
            gh pr close "${PR_URL}" --delete-branch \
              --comment "Swept into \`dependabot-upgrades\` (latest bump of a file clobbers the previous one)." \
              || git push origin --delete "${PR_HEAD}" || true
            echo "::endgroup::"
          done < "${bumps}"

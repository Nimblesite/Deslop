# agent-pmo:0b21609
name: Dependabot auto-merge

# Sweeps EVERY Dependabot PR into the long-lived `dependabot-upgrades` staging
# branch, no questions asked ([GITHUB-DEPENDABOT]). Two kinds of PR land here:
#
#   * VERSION updates  -> Dependabot opens them against `dependabot-upgrades`
#     directly (.github/dependabot.yml `target-branch`), and every ecosystem in
#     that file sets it. These are what this workflow sweeps.
#   * SECURITY updates -> GitHub IGNORES `target-branch` for these and ALWAYS
#     opens them against the default branch (`main`). They are handled by a
#     human, deliberately — see the trigger note below. A CVE bump getting eyes
#     on it is not a bad outcome, and `security` (dependency-review) in ci.yml
#     still gates it.
#
# Sweep strategy: PATH-RESTRICTED, not a branch merge. Only the files the PR
# itself changed (diff against its merge-base with the PR base) are copied from
# the bump branch onto the staging tip. Two reasons:
#
#   * The GITHUB_TOKEN can NEVER push changes to `.github/workflows/*` — the
#     `workflows` scope cannot be granted to it, not even via `permissions:`.
#     A full `git merge` of a security bump (based on current `main`) into a
#     staging branch that has drifted behind `main` drags main's newer commits
#     along — including workflow-file edits — and the push is rejected
#     (`refusing to allow a GitHub App to ... update workflow`). Copying only
#     the bump's own files makes the sweep immune to staging-branch drift.
#   * Clobber semantics survive: the latest bump overwrites the same manifest/
#     lock files, so successive bumps never conflict-stall — no merge machinery
#     left to conflict at all.
#
# If the bump ITSELF touches `.github/workflows/*` (the github-actions group),
# the token cannot COPY it by construction — but the PR merge API is not a
# push, and the workflow edits were authored by dependabot[bot], which may
# modify workflow files for its own ecosystem. So the sweep squash-merges the
# PR into the staging branch server-side instead (one commit, matching the
# sweep-commit history — exactly how #320 landed). Only if that merge fails
# (staging-tip conflict) is the PR left open with a comment for a human;
# stranded actions bumps are what dragged a whole stale staging branch into a
# feature branch on 17 Aug 2026 when one was hand-merged from its own branch.
#
# Nothing reaches `main` this way — the full build/test (ci.yml) + CodeQL
# (codeql.yml) gate the single `dependabot-upgrades -> main` consolidation PR,
# which is where review and the expensive matrix actually run. ci.yml,
# dependency review, and codeql.yml run for Dependabot PRs like any other —
# their former actor skips were removed, so a security bump against `main` is
# fully gated.
#
# THE DRAIN — the consolidation PR is not optional decoration. Sweeps only flow
# bumps INTO the staging branch; the `ensure-consolidation-pr` step below is
# what flows them OUT, by opening the `dependabot-upgrades -> main` PR whenever
# staging is ahead of main and no such PR is open. Without it, upgrades pile up
# on staging forever (Jul 25 – Aug 16 2026: 14 swept commits, zero consolidation
# PRs ever opened). One open PR is enough — it tracks later sweeps by itself.
# The weekly `schedule` trigger exists so the drain runs from MAIN's copy of
# this file: `pull_request` sweep runs execute the BASE branch's (staging's)
# copy, which only a human push can update, but scheduled runs always use the
# default branch's copy — so the drain cannot rot even when staging's copy has.
# Caveat: for a PR opened by GITHUB_TOKEN, GitHub creates its `pull_request`
# workflow runs in an approval-required state instead of starting them
# (recursive-workflow guard), so the PR body tells the reviewer to approve the
# pending runs to fire CI — they are the one merging it anyway.
#
# Lives at the repo root so it is present on `dependabot-upgrades` (cut from
# main): for `pull_request` the workflow is read from the PR's base branch, so
# BOTH `main` and the staging branch must carry this file. Actions cannot push
# workflow files, so updating the staging branch's copy is always a human push.
#
# ⚠️ SECURITY INVARIANT — the trigger MUST stay `pull_request`, NEVER
# `pull_request_target`. Under `pull_request` a fork PR runs with a READ-ONLY
# token and no secrets, so merging fork-controlled content here is inert.
# `pull_request_target` would hand the write token + secrets to that content and
# turn this merge bot into a real RCE/exfiltration sink — exactly the
# actions/untrusted-checkout finding, made true. Do not change it.
# ([GITHUB-CODE-SCANNING])
#
# ⚠️ BASE FILTER — `dependabot-upgrades` ONLY. Do not add `main` back. The job
# can only be narrowed to Dependabot by a job-level `if:`, and an `if:`-skipped
# job is NOT an absent job: GitHub still materialises it as a check run with
# conclusion `skipped`. Subscribing to PRs against `main` therefore hangs a dead
# `skipped` check on EVERY human PR, forever — a check that by construction can
# never once run. Filtering the base to the staging branch means this workflow
# is never instantiated for a human PR at all.
#
# A Dependabot sweep merge has reverted this once already (#306): the staging
# branch was cut before the fix, so its stale copy came back with the bump.
# Re-applying it here is not enough on its own — `dependabot-upgrades` needs the
# same edit, or the next sweep resurrects `- main` again.
on:
  pull_request:
    branches:
      - dependabot-upgrades
  # Weekly drain heartbeat, shortly after Dependabot's own weekly runs. Runs
  # from the default branch's copy of this file (see THE DRAIN above), adds no
  # check runs to any PR, so the [GITHUB-DEPENDABOT] dead-skipped-check
  # concern does not apply.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: Sweep bump files into dependabot-upgrades
    # Two independent gates, both required: the (unforgeable) Dependabot actor
    # AND a `dependabot/*` source branch. actor-AND-source keeps the trust
    # assumption explicit and resilient if the trigger set is ever widened.
    # Scheduled runs carry neither, so they pass on the event name alone and
    # execute only the drain step below.
    if: github.event_name == 'schedule' || (github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/'))
    # Deliberately the standard runner, NOT a larger/paid one: a trivial merge
    # bot must not consume CI minutes meant for the real build matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the staging branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot-upgrades
          fetch-depth: 0

      - name: Sweep the bump's files and retire the PR
        if: github.event_name == 'pull_request'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defense-in-depth: disable git hooks for every git op in this job, so
          # staging attacker-influenced tree content can never execute a hook by
          # construction. No hook is reachable today (hooks live in .git, not the
          # tree), but this holds regardless of any future change.
          git config --global core.hooksPath /dev/null
          # Pull the bump branch and its base into stable local refs.
          git fetch origin \
            "+refs/heads/${PR_HEAD}:refs/remotes/origin/${PR_HEAD}" \
            "+refs/heads/${PR_BASE}:refs/remotes/origin/${PR_BASE}"
          # The PR's OWN changes: diff against the merge-base with its base
          # branch, so nothing the base has accumulated rides along.
          merge_base="$(git merge-base "origin/${PR_BASE}" "origin/${PR_HEAD}")"
          changed_list="${RUNNER_TEMP}/dependabot-sweep-paths.z"
          git diff -z --name-only "${merge_base}" "origin/${PR_HEAD}" \
            > "${changed_list}"
          # The token cannot PUSH workflow files, but the merge API is not a
          # push: squash-merge the PR into the staging branch server-side (see
          # header). Comment-and-leave-open is the conflict fallback only.
          while IFS= read -r -d '' path; do
            case "${path}" in
              .github/workflows/*)
                echo "bump edits ${path}; squash-merging the PR server-side instead of copying"
                gh pr merge "${PR_URL}" --squash --delete-branch \
                  || gh pr comment "${PR_URL}" --body \
                    "Sweep could not squash-merge this workflow-file bump into \`dependabot-upgrades\` — likely a conflict with the staging tip. Comment \`@dependabot rebase\` and let the sweep retry, or merge manually."
                exit 0
                ;;
            esac
          done < "${changed_list}"
          # Re-apply onto the LIVE staging tip and retry: concurrent Dependabot
          # PRs race to push here, so each run restarts from whatever already
          # landed. Copying (not merging) the bump's paths keeps clobber
          # semantics: the latest bump of a file wins, every time.
          for attempt in 1 2 3 4 5; do
            git fetch origin "+refs/heads/dependabot-upgrades:refs/remotes/origin/dependabot-upgrades"
            git reset --hard "origin/dependabot-upgrades"
            while IFS= read -r -d '' path; do
              if git cat-file -e "origin/${PR_HEAD}:${path}" 2>/dev/null; then
                git checkout "origin/${PR_HEAD}" -- "${path}"
              else
                git rm -q --ignore-unmatch -- "${path}"
              fi
            done < "${changed_list}"
            if git diff --cached --quiet; then
              echo "bump already staged on dependabot-upgrades; nothing to commit"
              break
            fi
            git commit -q -m "build(deps): sweep ${PR_HEAD} into dependabot-upgrades"
            if git push origin "HEAD:dependabot-upgrades"; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "::error::could not push to dependabot-upgrades after 5 attempts"
              exit 1
            fi
            sleep 5
          done
          # Retire the PR + its branch: the bump is already staged, so the PR
          # (whether it targeted main or the staging branch) has served its
          # purpose. `|| true` — GitHub may have auto-closed it on the push.
          gh pr close "${PR_URL}" --delete-branch \
            --comment "Swept into \`dependabot-upgrades\` (latest bump of a file clobbers the previous one)." \
            || git push origin --delete "${PR_HEAD}" || true

      # THE DRAIN (see header): without this step nothing ever flows OUT of the
      # staging branch. Runs after every sweep and on the weekly schedule.
      - name: Ensure the consolidation PR is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open_count="$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head dependabot-upgrades --base main --state open \
            --json number --jq 'length')"
          if [ "${open_count}" != "0" ]; then
            echo "consolidation PR already open; it tracks new sweeps by itself"
            exit 0
          fi
          ahead="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/main...dependabot-upgrades" \
            --jq .ahead_by)"
          if [ "${ahead}" = "0" ]; then
            echo "staging branch has nothing to consolidate"
            exit 0
          fi
          # Concurrent sweeps race to create; GitHub rejects the duplicate, so
          # a failed create is fine exactly when a PR exists after all.
          gh pr create --repo "${GITHUB_REPOSITORY}" \
            --base main --head dependabot-upgrades \
            --title "build(deps): consolidate dependabot-upgrades into main" \
            --body "$(printf '%s\n' \
              "Drains the swept Dependabot bumps into \`main\` — the single consolidation PR that ci.yml and codeql.yml gate ([GITHUB-DEPENDABOT]). It tracks further sweeps until merged." \
              "" \
              "Opened by the Actions token, so GitHub holds this PR's workflow runs pending approval: **approve the pending workflow runs** on the Checks tab to fire CI before merging.")" \
            || [ "$(gh pr list --repo "${GITHUB_REPOSITORY}" \
                 --head dependabot-upgrades --base main --state open \
                 --json number --jq 'length')" != "0" ]

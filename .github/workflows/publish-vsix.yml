name: publish-vsix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, don't publish"
        required: false
        default: "true"

jobs:
  # Build the Rust binaries once per target triple. VSIX version is taken from
  # clients/vscode/package.json and must match Cargo workspace version — [VSIX-BINARY-VERSIONING].
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cargo build
        run: |
          cargo build --release --target ${{ matrix.target }} -p codededup-lsp -p codededup-mcp -p codededup
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.platform }}
          ext=""
          if [[ "${{ matrix.platform }}" == win32-* ]]; then ext=".exe"; fi
          cp target/${{ matrix.target }}/release/codededup-lsp${ext} dist/${{ matrix.platform }}/
          cp target/${{ matrix.target }}/release/codededup-mcp${ext} dist/${{ matrix.platform }}/
          cp target/${{ matrix.target }}/release/codededup${ext} dist/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}

  version-check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        shell: bash
        run: |
          vsix_version=$(jq -r .version clients/vscode/package.json)
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ -z "$cargo_version" ]]; then
            cargo_version=$(grep -m1 '^version' crates/codededup/Cargo.toml | cut -d'"' -f2)
          fi
          echo "vsix=$vsix_version cargo=$cargo_version"
          if [[ "$vsix_version" != "$cargo_version" ]]; then
            echo "::error::VSIX version ($vsix_version) must match Cargo version ($cargo_version) — [VSIX-BINARY-VERSIONING]"
            exit 1
          fi
          echo "version=$vsix_version" >> "$GITHUB_OUTPUT"

  package-vsix:
    needs: [build-binaries, version-check]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: clients/vscode/bin
          merge-multiple: false
      - name: Flatten artifacts into bin/<platform>/
        shell: bash
        run: |
          set -euo pipefail
          cd clients/vscode/bin
          for dir in binaries-*; do
            platform="${dir#binaries-}"
            mkdir -p "$platform"
            mv "$dir"/* "$platform"/
            rmdir "$dir"
          done
          chmod +x */codededup-lsp */codededup-mcp */codededup || true
      - name: Install extension deps
        working-directory: clients/vscode
        run: npm install
      - name: Install webview-ui deps
        working-directory: clients/vscode/webview-ui
        run: npm install
      - name: Build extension
        working-directory: clients/vscode
        run: npm run build
      - name: Build webview-ui
        working-directory: clients/vscode/webview-ui
        run: npm run build
      - name: Typecheck
        working-directory: clients/vscode
        run: npm run typecheck
      - name: Package VSIX
        working-directory: clients/vscode
        run: npx vsce package --no-dependencies -o codededup-vscode-${{ needs.version-check.outputs.version }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codededup-vscode
          path: clients/vscode/codededup-vscode-*.vsix
      - name: Publish to Marketplace
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        working-directory: clients/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath codededup-vscode-${{ needs.version-check.outputs.version }}.vsix
      - name: Publish to Open VSX
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        working-directory: clients/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish codededup-vscode-${{ needs.version-check.outputs.version }}.vsix -p "$OVSX_PAT"

# agent-pmo:0b21609
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path classifier — decides whether the heavy Rust / VSIX / JetBrains / Windows
  # gates need to run at all. A PR that only touches site/** (the Eleventy
  # website) or scripts/issues/** cannot affect those suites, so they are
  # skipped; the issue experience is still validated by the `site` job below.
  # Any other changed path sets `code=true` (a mixed PR runs everything).
  #
  # Gating uses job-level `if:` rather than workflow-level paths-ignore on
  # purpose: a workflow skipped by path filtering leaves its required checks
  # stuck "pending" and blocks merge forever, whereas a job skipped by an `if:`
  # reports the "skipped" conclusion, which branch protection counts as a
  # passing required status check.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      site: ${{ steps.classify.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # No Dependabot short-circuit here, deliberately. This workflow
          # triggers on `pull_request: [main]` only, and Dependabot's routine
          # version updates all carry `target-branch: dependabot-upgrades`
          # ([GITHUB-DEPENDABOT]) — so they never reach this workflow to be
          # skipped. The ONLY Dependabot PR that ever lands here is a SECURITY
          # update, which GitHub always opens against the default branch
          # regardless of `target-branch`, and which the sweep leaves in place
          # (its base filter is `dependabot-upgrades` only). An actor skip
          # therefore saved nothing on the routine bumps it was written for and
          # cost exactly one thing: the vulnerability fix reaching `main` was
          # the single PR class that merged without a build, a test, or a
          # dependency review.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files in this PR:"
          printf '%s\n' "$changed"
          # site = at least one website or issue-report generator file changed.
          # code = at least one file OUTSIDE site/ and scripts/issues/ changed,
          #        OR a
          #        design-system stylesheet that deslop-core compiles into
          #        the standalone HTML report via include_str!
          #        (crates/deslop-core/src/render/html_css.rs). Those CSS
          #        files live under site/ but ARE a build input to the
          #        binary: editing one changes the report's inline <style>,
          #        so the code pipeline — including the _vsix-playwright-html
          #        report-CSS guard — must run, or a broken/unstyled report
          #        could ship unverified. A mixed PR sets both.
          if printf '%s\n' "$changed" | grep -qE '^(site/|scripts/issues/)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qvE '^(site/|scripts/issues/)' \
             || printf '%s\n' "$changed" | grep -qE '^site/src/assets/css/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # [CI-RELEASE-BUILD] The one place the workspace is compiled. Format,
  # lint and the release gates all need the same warm target directory,
  # so they live here rather than duplicating the build across three
  # jobs. `ci` (Rust suite) and `vsix` (extension suite) then run in
  # parallel against exactly what this job cached.
  build:
    name: Build release
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Covers a release clippy build, the release workspace build, the
    # self-scan duplication gate and the deployment gates. The test
    # suites moved out to `ci` and `vsix`.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # CLAUDE.md invariant: tree-sitter grammars must stay pinned
      # with `=x.y.z` in the workspace `Cargo.toml`. This step fails
      # the build if any pin drifts to a caret / tilde / range
      # constraint so accidental unpinning can never land on main.
      - name: Verify grammar pins
        run: |
          set -euo pipefail
          for dep in tree-sitter tree-sitter-c-sharp tree-sitter-rust tree-sitter-python tree-sitter-dart tree-sitter-typescript tree-sitter-javascript tree-sitter-php tree-sitter-fsharp tree-sitter-go; do
            line=$(grep -E "^${dep} = " Cargo.toml || true)
            if [ -z "${line}" ]; then
              echo "MISSING PIN: ${dep} must appear in workspace.dependencies"
              exit 1
            fi
            if ! echo "${line}" | grep -qE '"=[0-9]+\.[0-9]+\.[0-9]+"'; then
              echo "LOOSE PIN: ${dep} must use an exact =x.y.z constraint, got: ${line}"
              exit 1
            fi
            echo "OK: ${line}"
          done

      # Rust toolchain + components. Grammar versions (tree-sitter,
      # tree-sitter-c-sharp, tree-sitter-rust, tree-sitter-python,
      # tree-sitter-dart, tree-sitter-typescript, tree-sitter-javascript,
      # tree-sitter-php, tree-sitter-fsharp, tree-sitter-go) are pinned
      # with `=x.y.z` in the workspace
      # `Cargo.toml`; the step above verifies the pins stay exact.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          # Caches the ~/.npm download store keyed on the extension
          # lockfiles. Purely additive: a miss installs fresh (prior
          # behaviour), a hit skips re-downloading the tarballs.
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # `typediagram` CLI is the wire-format generator invoked by both
      # `make typediagram-gen` and the deslop-core build.rs on every
      # `cargo build`. Pinned to keep CI / devcontainer / Makefile in
      # sync per CLAUDE.md dependency-pinning rules.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      # [CI-RELEASE-BUILD] One release build per run, shared by every
      # downstream job. The key is the commit, so the two parallel test
      # jobs get an exact hit on the build this run produced rather than
      # whatever a previous run happened to leave behind — a near-miss
      # there is how a test job silently recompiles the workspace and
      # the parallelism buys nothing. `restore-keys` still hands a cold
      # run the previous commit's target directory to build on top of.
      - name: Cache cargo registry and release target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # fmt, lint, test are three separate, non-overlapping steps.
      - name: Format check
        run: make fmt CHECK=1

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # Duplication gate ([CI-DESLOP]). Self-hosted: runs the release binary
      # built by the step above against this repo, so the gate is always the
      # CURRENT detector. It reads the ratcheted [threshold]
      # max_duplication_percent from .deslop.toml and exits 3 (failing CI) the
      # moment repo-wide duplication climbs past it. The threshold is the single
      # source of truth — never hardcoded here. The command lives in `make
      # dup-gate`, which `make ci` also runs, so a green local run cannot
      # disagree with this step.
      - name: Duplication gate (deslop)
        run: make dup-gate

      - name: Deployment manifest and binary gates
        run: make deployment-verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            target/release/deslop
            target/release/deslop-lsp
            target/release/deslop-mcp
          retention-days: 1

  # [CI-RELEASE-BUILD] The Rust suite, running in parallel with `vsix`
  # against the release build the `build` job cached. Keeps the `ci` job
  # id and the `CI` name because branch protection requires that check
  # by name — renaming it would leave the required status pending
  # forever and block every merge.
  #
  # Coverage cannot reuse `target/release/deslop` itself: `cargo
  # llvm-cov` compiles instrumented binaries into
  # `target/llvm-cov-target`, and an instrumented artifact can never
  # share a fingerprint with an uninstrumented one. `make test` passes
  # `--release` so the suite is at least the same *profile* as the
  # binaries every other job exercises, instead of gating release
  # artifacts on a debug-profile run.
  ci:
    name: CI
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: an instrumented release build of the whole
    # workspace plus the full E2E suite. Sized against runs that reach
    # the end rather than aborting at the first failure.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # See the build job — typediagram is required by build.rs and by
      # `make test`'s own `typediagram-gen` prerequisite.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-llvm-cov

      # [CI-RELEASE-BUILD] Restore-only: the `build` job owns the entry
      # for this commit, and a second job writing the same key would
      # race it. The exact key hits the release build this run already
      # produced, so nothing here recompiles the workspace.
      - name: Restore release build
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # make test = fail-fast + coverage + threshold enforcement ([TEST-RULES]).
      # Thresholds live in coverage-thresholds.json ([COVERAGE-THRESHOLDS-JSON]).
      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 1

  # Windows compile + transport gate ([LIVE-IPC-TCP]). Until now,
  # cfg(windows) code paths were only compiled by the release matrix —
  # a Windows-only regression could merge green and explode at release
  # time. This job checks the whole workspace on windows-latest and
  # runs the TCP transport E2E suite with the real Windows binaries,
  # because TCP loopback is the production IPC transport on Windows.
  windows:
    name: Windows check + TCP IPC E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # Same pinned generator as the Linux leg; deslop-core's build.rs
      # invokes it on every cargo build to produce the gitignored wire
      # models from docs/models/live-ipc.td.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check workspace (Windows)
        run: cargo check --workspace --locked --all-targets

      # `cargo check` links nothing and `cargo test -p deslop-mcp` only
      # builds that package's own binaries — the deslop-lsp.exe the E2E
      # suite spawns must be built explicitly first.
      - name: Build server binaries for E2E
        run: cargo build --locked -p deslop-lsp -p deslop-mcp

      - name: TCP transport E2E (real binaries)
        run: cargo test --locked -p deslop-mcp --test tcp_transport

  # [CI-RELEASE-BUILD] Runs in parallel with `ci`. `_vsix-build`'s
  # `cargo build --release -p deslop-lsp -p deslop-mcp -p deslop` is a
  # cache hit against the `build` job's target directory, so the E2E
  # suites spawn the very binaries that job produced instead of
  # compiling a second copy on the critical path.
  vsix:
    name: VSIX tests + coverage
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: builds the real LSP+MCP from source, installs Node
    # deps, then runs full E2E against headless VS Code Electron under xvfb —
    # the 10-minute default is too tight for the Electron download + E2E run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          # Caches the ~/.npm download store keyed on the extension
          # lockfiles. Purely additive: a miss installs fresh (prior
          # behaviour), a hit skips re-downloading the tarballs.
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # See ci job — typediagram is required by build.rs and Makefile.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      # [CI-RELEASE-BUILD] Restore-only: the `build` job owns the entry
      # for this commit, and a second job writing the same key would
      # race it. The exact key hits the release build this run already
      # produced, so nothing here recompiles the workspace.
      - name: Restore release build
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # xvfb gives Electron a display; dbus gives it a session bus so
      # ubuntu-latest stops flooding "Failed to connect to the bus" from the
      # Electron subprocesses.
      # A stalled Ubuntu mirror hangs `apt-get` indefinitely, and with the whole
      # job on one 20-minute budget that silently consumed every minute the E2E
      # needed: the job reported `cancelled` with all six test steps `skipped`,
      # which reads exactly like a test failure but proves nothing either way.
      # Bounding each call turns an 18-minute stall into a 150-second one plus a
      # retry, so a transient mirror fault costs a few minutes instead of the run.
      - name: Install xvfb + dbus (headless VS Code)
        timeout-minutes: 10
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 150 apt-get update \
              && sudo timeout 150 apt-get install -y xvfb dbus dbus-x11; then
              echo "xvfb + dbus installed on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::apt-get attempt ${attempt} stalled or failed; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install xvfb/dbus after 3 bounded attempts"
          exit 1

      # Builds the real deslop-lsp + deslop-mcp from the workspace
      # and installs Node deps for the extension + webview-ui.
      - name: _vsix-build
        run: make _vsix-build

      # Unit tests + coverage threshold. E2E spawns real VS Code Electron — run
      # it inside a private session bus to keep the Electron processes quiet.
      - name: _vsix-coverage (unit + threshold)
        run: xvfb-run -a dbus-run-session -- make _vsix-coverage

      - name: _vsix-test (full E2E against real LSP)
        run: xvfb-run -a dbus-run-session -- make _vsix-test

      # Renders the standalone HTML report (the artifact every "Open HTML
      # Report" button shows) and asserts the design-system CSS applies in a
      # real browser. The target installs the Chromium headless shell with its
      # OS libs (--with-deps), so the browser install lives in one place.
      - name: _vsix-playwright-html (standalone HTML report CSS)
        run: make _vsix-playwright-html

      # Webview V8 coverage gate ([VSIX-WEBVIEW-COVERAGE]). The webview bundle is
      # invisible to the c8 pass in _vsix-coverage (extension host only); this
      # drives the bundle in a real browser, maps coverage back to webview-ui/src,
      # and enforces .vsix.webview_threshold. Closes the blind spot behind #254.
      - name: _vsix-webview-coverage (webview V8 coverage threshold)
        run: make _vsix-webview-coverage

      - name: vsix-package deployment gate
        run: make vsix-package

      - name: Upload VSIX coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vsix-coverage
          path: |
            clients/vscode/coverage/
          retention-days: 1

  jetbrains:
    name: JetBrains package gate
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: a cold Gradle/IntelliJ-Platform build resolves the JB
    # SDK plus the LSP4IJ plugin, packages the plugin artifact, runs the resolver
    # test against the real released deslop-lsp binary, AND boots a headless IDE
    # for the integration test — well over the 10-minute default on a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          # Caches the ~/.npm download store keyed on the extension
          # lockfiles. Purely additive: a miss installs fresh (prior
          # behaviour), a hit skips re-downloading the tarballs.
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # See ci job — typediagram is required by build.rs and Makefile.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          # Cache the Gradle user home (IntelliJ-Platform SDK + LSP4IJ + deps).
          # The cold resolve dominates this gate (~378 job-min/month). Caching
          # keeps _jetbrains-real-binary-test running on every PR — it just stops
          # re-downloading the SDK each run.
          cache: gradle

      # The Gradle wrapper at clients/jetbrains/gradlew is the source of truth.
      # No external setup-gradle step needed.

      # Resolver tests against the real released deslop-lsp binary —
      # proves the version contract end-to-end (DTK-MIG-DESLOP-JETBRAINS-RESOLVER).
      - name: _jetbrains-real-binary-test
        run: make _jetbrains-real-binary-test

      # Real IDE-level test ([JETBRAINS-TESTING]): boots a headless IntelliJ Platform
      # with the ASSEMBLED plugin installed and asserts the Deslop tool window + Tools
      # action register through the shipped classloader layout — catches the
      # lib/modules/ content-module regression the descriptor test cannot. Invoked
      # through the Gradle wrapper directly (not a make target) to keep the Makefile
      # unchanged; every other jetbrains step goes through make.
      - name: jetbrains integration test (IDE-level UI registration)
        run: cd clients/jetbrains && ./gradlew :deslop-lsp4ij:integrationTest --no-daemon

      # Uses the checked-in Gradle wrapper via the Makefile default.
      - name: jetbrains-package deployment gate
        run: make _jetbrains-package

  # Website build + content gate. Runs whenever site/** changes — including on
  # website-only PRs, where the heavy `ci` job is skipped. Cheap: Node + Eleventy,
  # no Rust toolchain. This is the gate that keeps a website-only PR honest now
  # that it no longer drags the full pipeline behind it.
  site:
    name: Website build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate typed issue report
        run: |
          python -m pip install --disable-pip-version-check mypy==1.19.1 pyright==1.1.408
          python -B -m unittest scripts.issues.test_generate_issue_report
          python -m mypy --strict scripts/issues/generate_issue_report.py scripts/issues/test_generate_issue_report.py
          pyright scripts/issues/generate_issue_report.py scripts/issues/test_generate_issue_report.py

      # Taxonomy content gate ([CLONE-BUCKETS-DUAL-LABEL]) scans site/src for
      # bare Type-N labels. It normally runs inside `make lint` (the `ci` job);
      # on a website-only PR that job is skipped, so the one gate that guards
      # website copy runs here instead.
      - name: Taxonomy content gate
        run: bash scripts/repository/taxonomy-gate.sh

      # Installer fail-closed contract ([DEPLOY-DOCS-INSTALLER-FAILCLOSED]).
      # The snippet under test IS site content (site/src/docs/index.md and
      # its zh twin), so a site-only PR can change it while the `ci` job —
      # where `make lint` normally runs this — is skipped. The one test
      # written to protect the security-sensitive snippet must run wherever
      # that snippet can change.
      - name: Installer snippet contract
        run: node --test scripts/deployment/installer-snippet.test.mjs

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Install Playwright browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Test published issue experience
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI: "true"
        run: npm test -- --workers=1

  # Dependency review ([GITHUB-DEP-REVIEW]) — blocks PRs that pull in
  # dependencies with known vulnerabilities. One owner per concern: this is the
  # repo's only dependency vuln-gate (no cargo-deny/osv-scanner), `make lint`
  # owns style, and codeql.yml owns vulnerable code. The action diffs the PR, so
  # it only runs on pull_request events (this workflow's trigger).
  security:
    name: security
    # Runs for Dependabot too. A Dependabot PR only reaches this workflow when
    # it is a SECURITY update against `main` (see the classifier above), and
    # that is precisely the PR whose dependency graph needs reviewing — the fix
    # bump can pull a transitive dependency the advisory said nothing about.
    # ([GITHUB-DEPENDABOT])
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # dependency-review posts its PR summary
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

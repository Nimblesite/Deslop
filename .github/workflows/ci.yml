# agent-pmo:0b21609
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path classifier — decides whether the heavy Rust / VSIX / JetBrains / Windows
  # gates need to run at all. A PR that only touches site/** (the Eleventy
  # website) cannot affect those suites, so they are skipped; website content is
  # still validated by the `site` job below. Any changed file outside site/ sets
  # `code=true` and the full pipeline runs (a mixed PR runs everything).
  #
  # Gating uses job-level `if:` rather than workflow-level paths-ignore on
  # purpose: a workflow skipped by path filtering leaves its required checks
  # stuck "pending" and blocks merge forever, whereas a job skipped by an `if:`
  # reports the "skipped" conclusion, which branch protection counts as a
  # passing required status check.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      site: ${{ steps.classify.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files in this PR:"
          printf '%s\n' "$changed"
          # site = at least one website file changed.
          # code = at least one file OUTSIDE site/ changed, OR a
          #        design-system stylesheet that deslop-core compiles into
          #        the standalone HTML report via include_str!
          #        (crates/deslop-core/src/render/html_css.rs). Those CSS
          #        files live under site/ but ARE a build input to the
          #        binary: editing one changes the report's inline <style>,
          #        so the code pipeline — including the _vsix-playwright-html
          #        report-CSS guard — must run, or a broken/unstyled report
          #        could ship unverified. A mixed PR sets both.
          if printf '%s\n' "$changed" | grep -qE '^site/'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qvE '^site/' \
             || printf '%s\n' "$changed" | grep -qE '^site/src/assets/css/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md invariant: tree-sitter grammars must stay pinned
      # with `=x.y.z` in the workspace `Cargo.toml`. This step fails
      # the build if any pin drifts to a caret / tilde / range
      # constraint so accidental unpinning can never land on main.
      - name: Verify grammar pins
        run: |
          set -euo pipefail
          for dep in tree-sitter tree-sitter-c-sharp tree-sitter-rust tree-sitter-python tree-sitter-dart tree-sitter-typescript tree-sitter-javascript; do
            line=$(grep -E "^${dep} = " Cargo.toml || true)
            if [ -z "${line}" ]; then
              echo "MISSING PIN: ${dep} must appear in workspace.dependencies"
              exit 1
            fi
            if ! echo "${line}" | grep -qE '"=[0-9]+\.[0-9]+\.[0-9]+"'; then
              echo "LOOSE PIN: ${dep} must use an exact =x.y.z constraint, got: ${line}"
              exit 1
            fi
            echo "OK: ${line}"
          done

      # Rust toolchain + components. Grammar versions (tree-sitter,
      # tree-sitter-c-sharp, tree-sitter-rust, tree-sitter-python,
      # tree-sitter-dart, tree-sitter-typescript, tree-sitter-javascript)
      # are pinned with `=x.y.z` in the workspace
      # `Cargo.toml`; the step above verifies the pins stay exact.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          # Caches the ~/.npm download store keyed on the extension
          # lockfiles. Purely additive: a miss installs fresh (prior
          # behaviour), a hit skips re-downloading the tarballs.
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # `typediagram` CLI is the wire-format generator invoked by both
      # `make typediagram-gen` and the deslop-core build.rs on every
      # `cargo build`. Pinned to keep CI / devcontainer / Makefile in
      # sync per CLAUDE.md dependency-pinning rules.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # fmt, lint, test are three separate, non-overlapping steps.
      - name: Format check
        run: make fmt CHECK=1

      - name: Lint
        run: make lint

      # make test = fail-fast + coverage + threshold enforcement ([TEST-RULES]).
      # Thresholds live in coverage-thresholds.json ([COVERAGE-THRESHOLDS-JSON]).
      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 1

      - name: Build
        run: make build

      # Duplication gate ([CI-DESLOP]). Self-hosted: run the release binary
      # built by the step above against this repo. It reads the ratcheted
      # [threshold] max_duplication_percent from .deslop.toml and exits 3
      # (failing CI) the moment repo-wide duplication climbs past it. The
      # threshold is the single source of truth — never hardcoded here.
      - name: Duplication gate (deslop)
        run: ./target/release/deslop . --no-color

      - name: Deployment manifest and binary gates
        run: make deployment-verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/deslop
            target/release/deslop.exe
          retention-days: 1

  # Windows compile + transport gate ([LIVE-IPC-TCP]). Until now,
  # cfg(windows) code paths were only compiled by the release matrix —
  # a Windows-only regression could merge green and explode at release
  # time. This job checks the whole workspace on windows-latest and
  # runs the TCP transport E2E suite with the real Windows binaries,
  # because TCP loopback is the production IPC transport on Windows.
  windows:
    name: Windows check + TCP IPC E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # Same pinned generator as the Linux leg; deslop-core's build.rs
      # invokes it on every cargo build to produce the gitignored wire
      # models from docs/models/live-ipc.td.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check workspace (Windows)
        run: cargo check --workspace --locked --all-targets

      # `cargo check` links nothing and `cargo test -p deslop-mcp` only
      # builds that package's own binaries — the deslop-lsp.exe the E2E
      # suite spawns must be built explicitly first.
      - name: Build server binaries for E2E
        run: cargo build --locked -p deslop-lsp -p deslop-mcp

      - name: TCP transport E2E (real binaries)
        run: cargo test --locked -p deslop-mcp --test tcp_transport

  vsix:
    name: VSIX tests + coverage
    needs: [changes, ci]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: builds the real LSP+MCP from source, installs Node
    # deps, then runs full E2E against headless VS Code Electron under xvfb —
    # the 10-minute default is too tight for the Electron download + E2E run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          # Caches the ~/.npm download store keyed on the extension
          # lockfiles. Purely additive: a miss installs fresh (prior
          # behaviour), a hit skips re-downloading the tarballs.
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # See ci job — typediagram is required by build.rs and Makefile.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # xvfb gives Electron a display; dbus gives it a session bus so
      # ubuntu-latest stops flooding "Failed to connect to the bus" from the
      # Electron subprocesses. (activate() coverage attribution is a separate
      # concern, handled by the entry swap — [VSIX-TESTING-COVERAGE].)
      - name: Install xvfb + dbus (headless VS Code)
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus dbus-x11

      # Builds the real deslop-lsp + deslop-mcp from the workspace
      # and installs Node deps for the extension + webview-ui.
      - name: _vsix-build
        run: make _vsix-build

      # Unit tests + coverage threshold. E2E spawns real VS Code Electron — run
      # it inside a private session bus to keep the Electron processes quiet.
      - name: _vsix-coverage (unit + threshold)
        run: xvfb-run -a dbus-run-session -- make _vsix-coverage

      - name: _vsix-test (full E2E against real LSP)
        run: xvfb-run -a dbus-run-session -- make _vsix-test

      # Renders the standalone HTML report (the artifact every "Open HTML
      # Report" button shows) and asserts the design-system CSS applies in a
      # real browser. The target installs the Chromium headless shell with its
      # OS libs (--with-deps), so the browser install lives in one place.
      - name: _vsix-playwright-html (standalone HTML report CSS)
        run: make _vsix-playwright-html

      # Webview V8 coverage gate ([VSIX-WEBVIEW-COVERAGE]). The webview bundle is
      # invisible to the c8 pass in _vsix-coverage (extension host only); this
      # drives the bundle in a real browser, maps coverage back to webview-ui/src,
      # and enforces .vsix.webview_threshold. Closes the blind spot behind #254.
      - name: _vsix-webview-coverage (webview V8 coverage threshold)
        run: make _vsix-webview-coverage

      - name: vsix-package deployment gate
        run: make vsix-package

      - name: Upload VSIX coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsix-coverage
          path: |
            clients/vscode/coverage/
          retention-days: 1

  jetbrains:
    name: JetBrains package gate
    needs: [changes, ci]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: a cold Gradle/IntelliJ-Platform build resolves the JB
    # SDK plus the LSP4IJ plugin and packages the plugin artifact while running
    # the resolver test against the real released deslop-lsp binary — well over
    # the 10-minute default on a cold runner cache.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          # Caches the ~/.npm download store keyed on the extension
          # lockfiles. Purely additive: a miss installs fresh (prior
          # behaviour), a hit skips re-downloading the tarballs.
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # See ci job — typediagram is required by build.rs and Makefile.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Cache the Gradle user home (IntelliJ-Platform SDK + LSP4IJ + deps).
          # The cold resolve dominates this gate (~378 job-min/month). Caching
          # keeps _jetbrains-real-binary-test running on every PR — it just stops
          # re-downloading the SDK each run.
          cache: gradle

      # The Gradle wrapper at clients/jetbrains/gradlew is the source of truth.
      # No external setup-gradle step needed.

      # Resolver tests against the real released deslop-lsp binary —
      # proves the version contract end-to-end (DTK-MIG-DESLOP-JETBRAINS-RESOLVER).
      - name: _jetbrains-real-binary-test
        run: make _jetbrains-real-binary-test

      # Uses the checked-in Gradle wrapper via the Makefile default.
      - name: jetbrains-package deployment gate
        run: make jetbrains-package

  # Website build + content gate. Runs whenever site/** changes — including on
  # website-only PRs, where the heavy `ci` job is skipped. Cheap: Node + Eleventy,
  # no Rust toolchain. This is the gate that keeps a website-only PR honest now
  # that it no longer drags the full pipeline behind it.
  site:
    name: Website build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Taxonomy content gate ([CLONE-BUCKETS-DUAL-LABEL]) scans site/src for
      # bare Type-N labels. It normally runs inside `make lint` (the `ci` job);
      # on a website-only PR that job is skipped, so the one gate that guards
      # website copy runs here instead.
      - name: Taxonomy content gate
        run: bash scripts/taxonomy-gate.sh

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

  # Dependency review ([GITHUB-DEP-REVIEW]) — blocks PRs that pull in
  # dependencies with known vulnerabilities. One owner per concern: this is the
  # repo's only dependency vuln-gate (no cargo-deny/osv-scanner), `make lint`
  # owns style, and codeql.yml owns vulnerable code. The action diffs the PR, so
  # it only runs on pull_request events (this workflow's trigger).
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # dependency-review posts its PR summary
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

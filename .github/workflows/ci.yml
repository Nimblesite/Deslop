# agent-pmo:9a71cbf
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md invariant: tree-sitter grammars must stay pinned
      # with `=x.y.z` in the workspace `Cargo.toml`. This step fails
      # the build if any pin drifts to a caret / tilde / range
      # constraint so accidental unpinning can never land on main.
      - name: Verify grammar pins
        run: |
          set -euo pipefail
          for dep in tree-sitter tree-sitter-c-sharp tree-sitter-rust tree-sitter-python; do
            line=$(grep -E "^${dep} = " Cargo.toml || true)
            if [ -z "${line}" ]; then
              echo "MISSING PIN: ${dep} must appear in workspace.dependencies"
              exit 1
            fi
            if ! echo "${line}" | grep -qE '"=[0-9]+\.[0-9]+\.[0-9]+"'; then
              echo "LOOSE PIN: ${dep} must use an exact =x.y.z constraint, got: ${line}"
              exit 1
            fi
            echo "OK: ${line}"
          done

      # Rust toolchain + components. Grammar versions (tree-sitter,
      # tree-sitter-c-sharp, tree-sitter-rust, tree-sitter-python) are
      # pinned with `=x.y.z` in the workspace `Cargo.toml`; the step
      # above verifies the pins stay exact.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # fmt, lint, test are three separate, non-overlapping steps.
      - name: Format check
        run: make fmt CHECK=1

      - name: Lint
        run: make lint

      # make test = fail-fast + coverage + threshold enforcement ([TEST-RULES]).
      # Thresholds live in coverage-thresholds.json ([COVERAGE-THRESHOLDS-JSON]).
      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/
          retention-days: 7

      - name: Build
        run: make build

      - name: Deployment manifest and binary gates
        run: make deployment-verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/deslop
            target/release/deslop.exe
          retention-days: 7

  vsix:
    name: VSIX tests + coverage
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install xvfb (headless VS Code)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Builds the real deslop-lsp + deslop-mcp from the workspace
      # and installs Node deps for the extension + webview-ui.
      - name: vsix-build
        run: make vsix-build

      # Unit tests + coverage threshold. E2E spawns real VS Code Electron.
      - name: vsix-coverage (unit + threshold)
        run: xvfb-run -a make vsix-coverage

      - name: vsix-test (full E2E against real LSP)
        run: xvfb-run -a make vsix-test

      - name: vsix-package deployment gate
        run: make vsix-package

      - name: Upload VSIX coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsix-coverage
          path: |
            clients/vscode/coverage/
          retention-days: 7

  jetbrains:
    name: JetBrains package gate
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The Gradle wrapper at clients/jetbrains/gradlew is the source of truth.
      # No external setup-gradle step needed.

      # Resolver tests against the real released deslop-lsp binary —
      # proves the version contract end-to-end (DTK-MIG-DESLOP-JETBRAINS-RESOLVER).
      - name: jetbrains-real-binary-test
        run: make jetbrains-real-binary-test

      - name: jetbrains-package deployment gate
        run: make jetbrains-package

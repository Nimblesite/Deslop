# agent-pmo:b636503
name: Release

on:
  push:
    tags:
      # MAJOR.MINOR.PATCH only. A bare major alias such as `v1` — the mutable
      # ref Marketplace consumers conventionally pin an action to — must never
      # re-fire this pipeline and publish a release named "1". [ACTION-VERSION]
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  version:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Extract version from tag
        id: extract
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure tagged commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Shipwright manifest gate (DTK-MIG-DESLOP-CI-GATES, #41).
      # The manifest is the source of truth for activation checks and
      # release artifact verification; without stamping it here the
      # binary version verifier would fail the very next build.
      - name: Stamp release version
        run: node scripts/stamp-release-version.mjs "${{ steps.extract.outputs.version }}"

      - name: Validate deployment manifest
        run: node scripts/verify-deployment-manifest.mjs shipwright.json

  # Change-sensitive release classifier (proposed Shipwright spec SWR-REL-CHANGES).
  # Diffs the pushed tag against the prior v* release and decides which surfaces
  # changed, so a release skips building/publishing the components that did not.
  # Native git diff — NOT tj-actions/changed-files, whose CVEs SWR-SEC-ACTION-PINNING
  # exists to prevent. The single-version contract (SWR-REL-VERSION) plus per-host
  # activation-verify (onMismatch: error) means any shipped component bundles binaries
  # at the tag version, so a rust change is a full release; only the website decouples.
  changes:
    name: Classify changed release surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      vscode: ${{ steps.classify.outputs.vscode }}
      jetbrains: ${{ steps.classify.outputs.jetbrains }}
      website: ${{ steps.classify.outputs.website }}
      full: ${{ steps.classify.outputs.full }}
      any_component: ${{ steps.classify.outputs.any_component }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the classifier can diff against the prior release.
          fetch-depth: 0
      - name: Classify changed surfaces vs prior release
        id: classify
        run: python3 scripts/release-changes.py --head "${{ github.ref_name }}"

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: [version, changes]
    # Skip the whole 5-platform binary matrix (incl. the 10x macOS legs) when only
    # the website changed. Any shipped component bundles binaries at the tag version,
    # so vscode/jetbrains/rust all need the matrix; website-only does not.
    if: ${{ needs.changes.outputs.any_component == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x64
            vsix_target: linux-x64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64
            vsix_target: linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-x64
            vsix_target: darwin-x64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64
            vsix_target: darwin-arm64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            vsix_target: win32-x64
            cross: false
    runs-on: ${{ matrix.os }}
    # TIMEOUT EXCEPTION: each matrix leg builds release-mode Rust binaries,
    # packages a platform-specific VSIX, and verifies packaged binaries.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          # Caches the ~/.npm download store keyed on the extension
          # lockfiles, shared across all matrix legs. Purely additive: a
          # miss installs fresh (prior behaviour), a hit skips the tarball
          # downloads for the two `npm install` steps below + typediagram.
          cache: npm
          cache-dependency-path: |
            clients/vscode/package-lock.json
            clients/vscode/webview-ui/package-lock.json

      # `typediagram` CLI is the wire-format generator invoked by the
      # deslop-core build.rs on every `cargo build`. It must be installed
      # before any cargo build step (matching .github/workflows/ci.yml),
      # else build.rs fails with `spawnSync typediagram ENOENT`. Pinned to
      # keep CI / devcontainer / Makefile in sync per CLAUDE.md.
      - name: Install typediagram
        run: npm install -g typediagram@0.11.0

      - name: Stamp release version
        run: node scripts/stamp-release-version.mjs "${{ needs.version.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Key on Cargo.lock only: the release version-stamp rewrites Cargo.toml
          # on every tag, which would bust an exact key each release — forcing a
          # fresh ~GB cache save and thrashing the 10 GB cache LRU into cold
          # rebuilds on the 10x macOS legs. Cargo.lock is the true dependency
          # fingerprint; cargo's own fingerprinting recompiles changed crates.
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-

      # linux-arm64 cross-compiles with the GNU aarch64 toolchain as the
      # linker and the cc-crate C compiler (tree-sitter grammars are C/C++),
      # NOT the `cross` Docker tool. `cross` runs cargo — and therefore the
      # deslop-core build.rs / typediagram codegen — inside a container with
      # no Node or `typediagram`, which fails the build. Native cross-linking
      # keeps build.rs on the host where typediagram is installed (matches the
      # Basilisk release workflow).
      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p deslop -p deslop-lsp -p deslop-mcp

      # Shipwright binary version contract (DTK-MIG-DESLOP-CI-GATES, #41).
      # Skipped for cross-compiled targets because the foreign-arch binary
      # cannot execute on the runner; native targets cover the
      # version-stamping path the cross builds share.
      - name: Verify deployment binaries
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          case "${{ matrix.artifact_name }}" in
            linux-x64)   _platform=linux-x64 ;;
            linux-arm64) _platform=linux-arm64 ;;
            macos-x64)   _platform=darwin-x64 ;;
            macos-arm64) _platform=darwin-arm64 ;;
            windows-x64) _platform=win32-x64 ;;
            *) echo "unknown artifact ${{ matrix.artifact_name }}"; exit 1 ;;
          esac
          node scripts/verify-deployment-binaries.mjs shipwright.json "target/${{ matrix.target }}/release" "$_platform"

      - name: Package archive (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          stage="deslop-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}"
          mkdir -p "dist/${stage}"
          for b in deslop deslop-lsp deslop-mcp; do
            cp "target/${{ matrix.target }}/release/${b}" "dist/${stage}/"
          done
          cp README.md LICENSE* "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          shasum -a 256 "dist/${stage}.tar.gz" | awk '{print $1"  "$2}' | sed "s|dist/||" > "dist/${stage}.tar.gz.sha256"

      - name: Package archive (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "deslop-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          foreach ($b in @("deslop.exe", "deslop-lsp.exe", "deslop-mcp.exe")) {
            Copy-Item "target/${{ matrix.target }}/release/$b" "dist/$stage/"
          }
          if (Test-Path README.md) { Copy-Item README.md "dist/$stage/" }
          Get-ChildItem -Path . -Filter "LICENSE*" | ForEach-Object { Copy-Item $_.FullName "dist/$stage/" }
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$stage.zip").Hash.ToLower()
          "$hash  $stage.zip" | Out-File -FilePath "dist/$stage.zip.sha256" -Encoding ascii

      - name: Stage VSIX binaries (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clients/vscode/bin
          mkdir -p "clients/vscode/bin/${{ matrix.vsix_target }}"
          for b in deslop deslop-lsp deslop-mcp; do
            cp "target/${{ matrix.target }}/release/${b}" "clients/vscode/bin/${{ matrix.vsix_target }}/"
          done

      - name: Stage VSIX binaries (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue clients/vscode/bin
          New-Item -ItemType Directory -Force -Path "clients/vscode/bin/${{ matrix.vsix_target }}" | Out-Null
          foreach ($b in @("deslop.exe", "deslop-lsp.exe", "deslop-mcp.exe")) {
            Copy-Item "target/${{ matrix.target }}/release/$b" "clients/vscode/bin/${{ matrix.vsix_target }}/"
          }

      - name: Stage deployment manifest into extension
        shell: bash
        run: cp shipwright.json clients/vscode/shipwright.json

      - name: Install extension deps
        working-directory: clients/vscode
        run: npm ci --no-audit --no-fund

      - name: Install webview-ui deps
        working-directory: clients/vscode/webview-ui
        run: npm ci --no-audit --no-fund

      - name: Build webview-ui
        working-directory: clients/vscode/webview-ui
        run: npm run build

      - name: Typecheck extension
        working-directory: clients/vscode
        run: npx tsc --noEmit

      - name: Package target VSIX
        working-directory: clients/vscode
        run: npm run package -- --target ${{ matrix.vsix_target }} --out deslop-live-${{ needs.version.outputs.version }}-${{ matrix.vsix_target }}.vsix

      - name: Verify target VSIX
        working-directory: clients/vscode
        run: node ./scripts/verify-vsix-package.mjs deslop-live-${{ needs.version.outputs.version }}-${{ matrix.vsix_target }}.vsix ${{ matrix.vsix_target }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/deslop-*.tar.gz
            dist/deslop-*.tar.gz.sha256
            dist/deslop-*.zip
            dist/deslop-*.zip.sha256
          if-no-files-found: error
          # Intermediate build output: consumed by the release/publish jobs in
          # this same run, then attached to the GitHub Release. Nothing needs it
          # afterward, so expire it next day instead of the 90-day default.
          retention-days: 1

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.vsix_target }}
          path: clients/vscode/deslop-live-*.vsix
          if-no-files-found: error
          # See "Upload CLI artifact": transient, published to the Release.
          retention-days: 1

  jetbrains:
    name: Build JetBrains plugin
    needs: [version, build, changes]
    # Only when the plugin or its bundled deslop-lsp binary changed (rust -> full).
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.jetbrains == 'true' }}
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: a cold Gradle/IntelliJ-Platform build resolves the JB SDK
    # plus the LSP4IJ plugin, then builds the plugin zip bundling the all-platform
    # deslop-lsp binaries assembled from the release matrix artifacts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Cache the Gradle user home (IntelliJ-Platform SDK + LSP4IJ + deps).
          # The cold dependency resolve dominates this job; caching keeps every
          # gate running while skipping the multi-hundred-MB SDK re-download.
          cache: gradle

      # Lock-step version: stamps shipwright.json (the staged manifest the plugin
      # verifies its bundled binary against) to the tag version. The Gradle plugin
      # version is passed via -PdeslopVersion so the zip filenames match.
      - name: Stamp release version
        run: node scripts/stamp-release-version.mjs "${{ needs.version.outputs.version }}"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      # The JetBrains plugin ships as a single zip bundling deslop-lsp for EVERY
      # platform (JetBrains Marketplace cannot publish per-OS zips, so activation
      # must not download executable code). Assemble the <platform>/deslop-lsp[.exe]
      # layout the bundling task expects from the per-platform CLI archives the
      # build matrix already produced.
      - name: Assemble per-platform deslop-lsp bundle
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p bundle
          for entry in "linux-x64:linux-x64" "linux-arm64:linux-arm64" \
                       "macos-x64:darwin-x64" "macos-arm64:darwin-arm64" "windows-x64:win32-x64"; do
            artifact="${entry%%:*}"; platform="${entry##*:}"
            mkdir -p "bundle/${platform}"
            if [ "${artifact}" = "windows-x64" ]; then
              archive="$(find artifacts -name "deslop-${version}-${artifact}.zip" | head -n1)"
              unzip -j "${archive}" "deslop-${version}-${artifact}/deslop-lsp.exe" -d "bundle/${platform}"
            else
              archive="$(find artifacts -name "deslop-${version}-${artifact}.tar.gz" | head -n1)"
              tar -xzf "${archive}" -C "bundle/${platform}" --strip-components=1 \
                "deslop-${version}-${artifact}/deslop-lsp"
            fi
          done

      - name: Build the plugin zip (all platforms bundled)
        working-directory: clients/jetbrains
        run: |
          DESLOP_LSP_BUNDLE_DIR="${GITHUB_WORKSPACE}/bundle" \
            ./gradlew :deslop-lsp4ij:buildPlugin \
            -PdeslopVersion="${{ needs.version.outputs.version }}"

      - name: Verify the plugin package
        run: node scripts/verify-jetbrains-package.mjs

      - name: Upload JetBrains plugin
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-plugins
          path: |
            clients/jetbrains/deslop-lsp4ij/build/distributions/*.zip
          if-no-files-found: error
          # See "Upload CLI artifact": transient, published to the Release.
          retention-days: 1

  release:
    name: Create GitHub release
    needs: [version, build, jetbrains, changes]
    # Runs whenever any component was built. jetbrains is skipped on a vscode-only
    # release, so guard explicitly instead of via the implicit needs-success rule.
    if: ${{ !cancelled() && needs.changes.outputs.any_component == 'true' && needs.version.result == 'success' && needs.build.result == 'success' && (needs.jetbrains.result == 'success' || needs.jetbrains.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Flatten artifacts and build combined checksum file
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.vsix' \) -exec cp {} release-files/ \;
          cd release-files
          : > SHA256SUMS
          for f in *.tar.gz *.zip *.vsix; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: deslop ${{ needs.version.outputs.version }}
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  deploy-pages:
    name: Deploy website to GitHub Pages
    # Depend on (but tolerate a skipped) release so a full release still deploys the
    # site AFTER the GitHub Release exists, while a website-only tag — where release
    # is skipped — still deploys.
    needs: [version, changes, release]
    # Only stable tags publish the site. SemVer prerelease tags
    # (v0.1.0-rc.1, v0.1.0-beta, …) contain a hyphen and are skipped, so a
    # prerelease never overwrites the live site. Deploy when the website changed or
    # on any full release (the site embeds version-derived content). Triggered by the
    # v* tag — never by a push to main.
    if: ${{ !cancelled() && !contains(github.ref_name, '-') && (needs.changes.outputs.website == 'true' || needs.changes.outputs.full == 'true') && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [version, release, changes]
    # Homebrew ships the CLI binary — only update it on a full (rust/infra) release.
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Compute checksums and write Formula
        id: formula
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/v${version}"

          mac_arm_tar="deslop-${version}-macos-arm64.tar.gz"
          mac_x64_tar="deslop-${version}-macos-x64.tar.gz"
          linux_x64_tar="deslop-${version}-linux-x64.tar.gz"
          linux_arm_tar="deslop-${version}-linux-arm64.tar.gz"

          for f in "$mac_arm_tar" "$mac_x64_tar" "$linux_x64_tar" "$linux_arm_tar"; do
            path=$(find artifacts -name "$f" -type f | head -n1)
            if [ -z "$path" ]; then
              echo "FAIL: missing release artifact $f" >&2
              exit 1
            fi
            sha=$(sha256sum "$path" | awk '{print $1}')
            case "$f" in
              "$mac_arm_tar")   mac_arm_sha=$sha ;;
              "$mac_x64_tar")   mac_x64_sha=$sha ;;
              "$linux_x64_tar") linux_x64_sha=$sha ;;
              "$linux_arm_tar") linux_arm_sha=$sha ;;
            esac
          done

          mkdir -p tap/Formula
          cat > tap/Formula/deslop.rb <<EOF
          class Deslop < Formula
            desc "Live duplicate-code analysis server for AI coding agents"
            homepage "https://github.com/${{ github.repository }}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/${mac_arm_tar}"
                sha256 "${mac_arm_sha}"
              end
              on_intel do
                url "${base}/${mac_x64_tar}"
                sha256 "${mac_x64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/${linux_arm_tar}"
                sha256 "${linux_arm_sha}"
              end
              on_intel do
                url "${base}/${linux_x64_tar}"
                sha256 "${linux_x64_sha}"
              end
            end

            # Install all three binaries unconditionally. The release tarball
            # always contains them (the packaging step copies deslop, deslop-lsp,
            # and deslop-mcp, and verify-deployment-binaries.mjs gates the build
            # on their presence). A bare `bin.install` fails loudly if a binary
            # is ever missing — a silent `if File.exist?` guard previously let a
            # stale tarball install only `deslop`, leaving deslop-mcp off PATH
            # (issue #240).
            def install
              bin.install "deslop"
              bin.install "deslop-lsp"
              bin.install "deslop-mcp"
            end

            test do
              assert_match "${version}", shell_output("#{bin}/deslop --version")
            end
          end
          EOF

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: Nimblesite/homebrew-tap
          token: ${{ secrets.BREW_SCOOP_PAT }}
          path: homebrew-tap

      - name: Commit and push Formula
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp tap/Formula/deslop.rb homebrew-tap/Formula/deslop.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/deslop.rb
          git diff --staged --quiet && exit 0
          git commit -m "deslop ${{ needs.version.outputs.version }}"
          git push

  publish-scoop:
    name: Publish Scoop manifest
    needs: [version, release, changes]
    # Scoop ships the CLI binary — only update it on a full (rust/infra) release.
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Build Scoop manifest
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/v${version}"
          win_zip="deslop-${version}-windows-x64.zip"

          path=$(find artifacts -name "$win_zip" -type f | head -n1)
          if [ -z "$path" ]; then
            echo "FAIL: missing $win_zip" >&2
            exit 1
          fi
          win_sha=$(sha256sum "$path" | awk '{print $1}')

          mkdir -p bucket/bucket
          cat > bucket/bucket/deslop.json <<EOF
          {
            "version": "${version}",
            "description": "Live duplicate-code analysis server for AI coding agents",
            "homepage": "https://github.com/${{ github.repository }}",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "${base}/${win_zip}",
                "hash": "${win_sha}"
              }
            },
            "bin": [
              "deslop.exe",
              "deslop-lsp.exe",
              "deslop-mcp.exe"
            ],
            "checkver": {
              "github": "https://github.com/${{ github.repository }}"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "${base}/deslop-\$version-windows-x64.zip"
                }
              }
            }
          }
          EOF

      - name: Checkout scoop-bucket
        uses: actions/checkout@v7
        with:
          repository: Nimblesite/scoop-bucket
          token: ${{ secrets.BREW_SCOOP_PAT }}
          path: scoop-bucket

      - name: Commit and push manifest
        run: |
          set -euo pipefail
          mkdir -p scoop-bucket/bucket
          cp bucket/bucket/deslop.json scoop-bucket/bucket/deslop.json
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/deslop.json
          git diff --staged --quiet && exit 0
          git commit -m "deslop ${{ needs.version.outputs.version }}"
          git push

  publish-marketplace:
    name: Publish VSIX to VS Code Marketplace
    needs: [version, release, changes]
    # The VSIX changes on a rust (bundled binaries re-stamped) or vscode change.
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.vscode == 'true') && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Passwordless publish via Microsoft Entra ID OIDC: the release environment
    # gives the GitHub OIDC subject a stable
    # repo:OWNER/REPO:environment:release shape for Entra federation.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # One `vsce publish` per platform-specific VSIX — vsce silently uses only
      # the first when several are globbed into a single call. The Marketplace
      # forbids a SemVer prerelease suffix in the version field, so the VSIX is
      # packaged with the core MAJOR.MINOR.PATCH (see stamp-release-version.mjs)
      # and prerelease status is conveyed by the --pre-release flag for any
      # hyphenated tag. The short-lived Marketplace token is minted from the
      # Entra OIDC session and passed to vsce through VSCE_PAT; no PAT secret is
      # stored. See docs/specs/release.md.
      - name: Publish each platform VSIX (Entra OIDC, no PAT)
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          fi
          VSCE_PAT="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)"
          echo "::add-mask::${VSCE_PAT}"
          export VSCE_PAT
          published=0
          for vsix in artifacts/**/*.vsix; do
            echo "Publishing ${vsix}"
            npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate ${flag} --packagePath "${vsix}"
            published=$((published + 1))
          done
          if [ "${published}" -eq 0 ]; then
            echo "::error::no VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published ${published} VSIX(es) to the Marketplace"

  publish-openvsx:
    name: Publish VSIX to Open VSX
    needs: [version, release, changes]
    # The VSIX changes on a rust (bundled binaries re-stamped) or vscode change.
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.vscode == 'true') && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Open VSX has no OIDC trusted-publishing path today, so this uses a
    # separate Open VSX token scoped to the protected release environment.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Publish each platform VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPEN_VSX_PAT secret is not set; cannot publish to Open VSX"
            exit 1
          fi
          shopt -s globstar nullglob
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          fi
          published=0
          for vsix in artifacts/**/*.vsix; do
            echo "Publishing ${vsix}"
            npx --yes ovsx@1.0.0 publish --skip-duplicate ${flag} --packagePath "${vsix}"
            published=$((published + 1))
          done
          if [ "${published}" -eq 0 ]; then
            echo "::error::no VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published ${published} VSIX(es) to Open VSX"

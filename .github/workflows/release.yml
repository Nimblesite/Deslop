# agent-pmo:9a71cbf
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Extract version from tag
        id: extract
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure tagged commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Shipwright deployment-toolkit gate (DTK-MIG-DESLOP-CI-GATES, #41).
      # The manifest is the source of truth for activation checks and
      # release artifact verification; without stamping it here the
      # binary version verifier would fail the very next build.
      - name: Stamp release version
        run: node scripts/stamp-release-version.mjs "${{ steps.extract.outputs.version }}"

      - name: Validate deployment manifest
        run: node scripts/verify-deployment-manifest.mjs deployment-toolkit.json

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x64
            vsix_target: linux-x64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64
            vsix_target: linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-x64
            vsix_target: darwin-x64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64
            vsix_target: darwin-arm64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            vsix_target: win32-x64
            cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Stamp release version
        run: node scripts/stamp-release-version.mjs "${{ needs.version.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Install cross (for cross-compiled targets)
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build release binaries (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p deslop -p deslop-lsp -p deslop-mcp

      - name: Build release binaries (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p deslop -p deslop-lsp -p deslop-mcp

      # Shipwright binary version contract (DTK-MIG-DESLOP-CI-GATES, #41).
      # Skipped for cross-compiled targets because the foreign-arch binary
      # cannot execute on the runner; native targets cover the
      # version-stamping path the cross builds share.
      - name: Verify deployment binaries
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          case "${{ matrix.artifact_name }}" in
            linux-x64)   _platform=linux-x64 ;;
            linux-arm64) _platform=linux-arm64 ;;
            macos-x64)   _platform=darwin-x64 ;;
            macos-arm64) _platform=darwin-arm64 ;;
            windows-x64) _platform=win32-x64 ;;
            *) echo "unknown artifact ${{ matrix.artifact_name }}"; exit 1 ;;
          esac
          node scripts/verify-deployment-binaries.mjs deployment-toolkit.json "target/${{ matrix.target }}/release" "$_platform"

      - name: Package archive (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          stage="deslop-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}"
          mkdir -p "dist/${stage}"
          for b in deslop deslop-lsp deslop-mcp; do
            cp "target/${{ matrix.target }}/release/${b}" "dist/${stage}/"
          done
          cp README.md LICENSE* "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          shasum -a 256 "dist/${stage}.tar.gz" | awk '{print $1"  "$2}' | sed "s|dist/||" > "dist/${stage}.tar.gz.sha256"

      - name: Package archive (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "deslop-${{ needs.version.outputs.version }}-${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          foreach ($b in @("deslop.exe", "deslop-lsp.exe", "deslop-mcp.exe")) {
            Copy-Item "target/${{ matrix.target }}/release/$b" "dist/$stage/"
          }
          if (Test-Path README.md) { Copy-Item README.md "dist/$stage/" }
          Get-ChildItem -Path . -Filter "LICENSE*" | ForEach-Object { Copy-Item $_.FullName "dist/$stage/" }
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$stage.zip").Hash.ToLower()
          "$hash  $stage.zip" | Out-File -FilePath "dist/$stage.zip.sha256" -Encoding ascii

      - name: Stage VSIX binaries (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clients/vscode/bin
          mkdir -p "clients/vscode/bin/${{ matrix.vsix_target }}"
          for b in deslop deslop-lsp deslop-mcp; do
            cp "target/${{ matrix.target }}/release/${b}" "clients/vscode/bin/${{ matrix.vsix_target }}/"
          done

      - name: Stage VSIX binaries (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue clients/vscode/bin
          New-Item -ItemType Directory -Force -Path "clients/vscode/bin/${{ matrix.vsix_target }}" | Out-Null
          foreach ($b in @("deslop.exe", "deslop-lsp.exe", "deslop-mcp.exe")) {
            Copy-Item "target/${{ matrix.target }}/release/$b" "clients/vscode/bin/${{ matrix.vsix_target }}/"
          }

      - name: Stage deployment manifest into extension
        shell: bash
        run: cp deployment-toolkit.json clients/vscode/deployment-toolkit.json

      - name: Install extension deps
        working-directory: clients/vscode
        run: npm install --no-audit --no-fund

      - name: Install webview-ui deps
        working-directory: clients/vscode/webview-ui
        run: npm install --no-audit --no-fund

      - name: Build webview-ui
        working-directory: clients/vscode/webview-ui
        run: npm run build

      - name: Typecheck extension
        working-directory: clients/vscode
        run: npx tsc --noEmit

      - name: Package target VSIX
        working-directory: clients/vscode
        run: npm run package -- --target ${{ matrix.vsix_target }} --out deslop-vscode-${{ needs.version.outputs.version }}-${{ matrix.vsix_target }}.vsix

      - name: Verify target VSIX
        working-directory: clients/vscode
        run: node ./scripts/verify-vsix-package.mjs deslop-vscode-${{ needs.version.outputs.version }}-${{ matrix.vsix_target }}.vsix ${{ matrix.vsix_target }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/deslop-*.tar.gz
            dist/deslop-*.tar.gz.sha256
            dist/deslop-*.zip
            dist/deslop-*.zip.sha256
          if-no-files-found: error

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsix_target }}
          path: clients/vscode/deslop-vscode-*.vsix
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts and build combined checksum file
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.vsix' \) -exec cp {} release-files/ \;
          cd release-files
          : > SHA256SUMS
          for f in *.tar.gz *.zip *.vsix; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: deslop ${{ needs.version.outputs.version }}
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Compute checksums and write Formula
        id: formula
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/v${version}"

          mac_arm_tar="deslop-${version}-macos-arm64.tar.gz"
          mac_x64_tar="deslop-${version}-macos-x64.tar.gz"
          linux_x64_tar="deslop-${version}-linux-x64.tar.gz"
          linux_arm_tar="deslop-${version}-linux-arm64.tar.gz"

          for f in "$mac_arm_tar" "$mac_x64_tar" "$linux_x64_tar" "$linux_arm_tar"; do
            path=$(find artifacts -name "$f" -type f | head -n1)
            if [ -z "$path" ]; then
              echo "FAIL: missing release artifact $f" >&2
              exit 1
            fi
            sha=$(sha256sum "$path" | awk '{print $1}')
            case "$f" in
              "$mac_arm_tar")   mac_arm_sha=$sha ;;
              "$mac_x64_tar")   mac_x64_sha=$sha ;;
              "$linux_x64_tar") linux_x64_sha=$sha ;;
              "$linux_arm_tar") linux_arm_sha=$sha ;;
            esac
          done

          mkdir -p tap/Formula
          cat > tap/Formula/deslop.rb <<EOF
          class Deslop < Formula
            desc "Live duplicate-code analysis server for AI coding agents"
            homepage "https://github.com/${{ github.repository }}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/${mac_arm_tar}"
                sha256 "${mac_arm_sha}"
              end
              on_intel do
                url "${base}/${mac_x64_tar}"
                sha256 "${mac_x64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/${linux_arm_tar}"
                sha256 "${linux_arm_sha}"
              end
              on_intel do
                url "${base}/${linux_x64_tar}"
                sha256 "${linux_x64_sha}"
              end
            end

            def install
              bin.install "deslop"
              bin.install "deslop-lsp" if File.exist?("deslop-lsp")
              bin.install "deslop-mcp" if File.exist?("deslop-mcp")
            end

            test do
              assert_match "${version}", shell_output("#{bin}/deslop --version")
            end
          end
          EOF

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: Nimblesite/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Commit and push Formula
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp tap/Formula/deslop.rb homebrew-tap/Formula/deslop.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/deslop.rb
          git diff --staged --quiet && exit 0
          git commit -m "deslop ${{ needs.version.outputs.version }}"
          git push

  publish-scoop:
    name: Publish Scoop manifest
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build Scoop manifest
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/v${version}"
          win_zip="deslop-${version}-windows-x64.zip"

          path=$(find artifacts -name "$win_zip" -type f | head -n1)
          if [ -z "$path" ]; then
            echo "FAIL: missing $win_zip" >&2
            exit 1
          fi
          win_sha=$(sha256sum "$path" | awk '{print $1}')

          mkdir -p bucket/bucket
          cat > bucket/bucket/deslop.json <<EOF
          {
            "version": "${version}",
            "description": "Live duplicate-code analysis server for AI coding agents",
            "homepage": "https://github.com/${{ github.repository }}",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "${base}/${win_zip}",
                "hash": "${win_sha}"
              }
            },
            "bin": [
              "deslop.exe",
              "deslop-lsp.exe",
              "deslop-mcp.exe"
            ],
            "checkver": {
              "github": "https://github.com/${{ github.repository }}"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "${base}/deslop-\$version-windows-x64.zip"
                }
              }
            }
          }
          EOF

      - name: Checkout scoop-bucket
        uses: actions/checkout@v4
        with:
          repository: Nimblesite/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Commit and push manifest
        run: |
          set -euo pipefail
          mkdir -p scoop-bucket/bucket
          cp bucket/bucket/deslop.json scoop-bucket/bucket/deslop.json
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/deslop.json
          git diff --staged --quiet && exit 0
          git commit -m "deslop ${{ needs.version.outputs.version }}"
          git push

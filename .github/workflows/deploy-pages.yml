# agent-pmo:b636503
name: Deploy GitHub Pages

# Reusable site deploy. It deliberately has NO `push` trigger — the live site
# only updates as part of a release. release.yml calls this after the stable
# GitHub Release is created (a release made with the default GITHUB_TOKEN does
# not emit a `release: published` event that can start another workflow, so the
# release pipeline invokes this one directly). `workflow_dispatch` allows a
# manual redeploy. Nothing here fires on a push to main.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Ref to build the site from. Defaults to the calling ref, so a rollback release deploys the site of the commit it ships."
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - name: Remove stale Pages artifact from rerun
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            while IFS= read -r artifact_id; do
              [ -n "${artifact_id}" ] || continue
              gh api -X DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

      - uses: actions/deploy-pages@v5
        id: deploy
        continue-on-error: true

      - name: Pause before retrying Pages deploy
        if: ${{ steps.deploy.outcome == 'failure' }}
        run: sleep 30

      - uses: actions/deploy-pages@v5
        id: deploy_retry
        if: ${{ steps.deploy.outcome == 'failure' }}
        continue-on-error: true

      - name: Fail if Pages deployment did not recover
        if: ${{ steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure' }}
        run: |
          echo "GitHub Pages deployment failed after retry."
          exit 1

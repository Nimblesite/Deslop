[package]
name = "deslop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deslop CLI — cold-cache entry point for the live duplicate-code analysis server. One-shot scans, CI gates, and report rendering (JSON / TXT / HTML)."

[[bin]]
name = "deslop"
path = "src/main.rs"

[dependencies]
deslop-core = { path = "../deslop-core" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
deslop-core = { path = "../deslop-core", features = ["test-support"] }
deslop-test-support = { path = "../deslop-test-support" }
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true

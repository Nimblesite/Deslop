[package]
name = "deslop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deslop CLI — cold-cache entry point for the live duplicate-code analysis server. One-shot scans, CI gates, and report rendering (JSON / TXT / HTML)."

[[bin]]
name = "deslop"
path = "src/main.rs"

[features]
# [TEST-SELECTION] Opts a build in to the real-repository corpus suite. Off by
# default, so `make test` never builds or runs a test that clones GitHub and
# measures wall time. Selection is structural — nothing is filtered by name.
corpus-repos = []

# [CORPUS-PIN] The expensive clone-and-scan gate. `required-features` keeps it
# out of `cargo test --workspace` unless `--features corpus-repos` asks for it.
[[test]]
name = "corpus_repos"
path = "tests/corpus_repos.rs"
required-features = ["corpus-repos"]

[dependencies]
deslop-core = { path = "../deslop-core" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
deslop-core = { path = "../deslop-core", features = ["test-support"] }
deslop-test-support = { path = "../deslop-test-support" }
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "deslop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deslop analysis engine — AST fingerprinting, clustering, ranking, live incremental re-analysis. The shared core behind the LSP, MCP, and CLI surfaces."

[features]
default = []
live = ["dep:notify", "dep:tokio", "dep:futures", "dep:async-trait", "dep:getrandom"]
# Enables `embedding::test_support::StubProvider` for downstream test
# crates. Never enable in production binaries — the deterministic
# BLAKE3 shim is not a product provider.
test-support = []

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-dart.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-php.workspace = true
tree-sitter-fsharp.workspace = true
tree-sitter-go.workspace = true
ignore.workspace = true
blake3.workspace = true
ureq.workspace = true
instant-distance.workspace = true
getrandom = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# Unix process-existence probe shared by the LSP and MCP parent-process
# monitors (`crate::process`). `signal` provides `kill(pid, 0)`. Version
# kept in lockstep with `deslop-lsp` / `deslop-mcp` per CLAUDE.md.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
anyhow.workspace = true
deslop-test-support = { path = "../deslop-test-support" }
tokio = { workspace = true }
tempfile.workspace = true

[lints]
workspace = true

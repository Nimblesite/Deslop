[package]
name = "deslop-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deslop LSP server — live duplicate-code analysis streamed to any LSP-capable editor as code is written."

[[bin]]
name = "deslop-lsp"
path = "src/main.rs"

[lib]
name = "deslop_lsp"
path = "src/lib.rs"

[features]
default = []
profiling = ["dep:fxprof-processed-profile", "dep:pprof"]

[dependencies]
deslop-core = { path = "../deslop-core", features = ["live"] }
tower.workspace = true
tower-lsp.workspace = true
tokio.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true

[target.'cfg(unix)'.dependencies]
fxprof-processed-profile = { version = "=0.8.1", optional = true }
pprof = { version = "=0.15.0", default-features = false, optional = true }
rustix = { version = "=0.38.44", features = ["process"] }

[dev-dependencies]
anyhow.workspace = true
assert_cmd.workspace = true
deslop-core = { path = "../deslop-core", features = ["live", "test-support"] }
deslop-test-support = { path = "../deslop-test-support" }
tempfile.workspace = true
tower-lsp.workspace = true

[lints]
workspace = true

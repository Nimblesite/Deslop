[package]
name = "deslop-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deslop MCP server — live duplicate-code tools over stdio for Claude, Cursor, Codex, Continue, and any MCP-capable AI coding agent. Query the running analysis mid-generation, before a copy-paste happens."

[[bin]]
name = "deslop-mcp"
path = "src/main.rs"

[lib]
name = "deslop_mcp"
path = "src/lib.rs"

[dependencies]
deslop-core = { path = "../deslop-core", features = ["live"] }
notify.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["process"] }

[dev-dependencies]
anyhow.workspace = true
assert_cmd.workspace = true
deslop-core = { path = "../deslop-core", features = ["live", "test-support"] }
deslop-test-support = { path = "../deslop-test-support" }
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true

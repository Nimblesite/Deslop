[package]
name = "deslop-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deslop MCP server — live duplicate-code tools over stdio for Claude, Cursor, Codex, Continue, and any MCP-capable AI coding agent. Query the running analysis mid-generation, before a copy-paste happens."
autotests = false

[[bin]]
name = "deslop-mcp"
path = "src/main.rs"

[lib]
name = "deslop_mcp"
path = "src/lib.rs"

[dependencies]
deslop-core = { path = "../deslop-core", features = ["live"] }
notify.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process"] }

[dev-dependencies]
anyhow.workspace = true
assert_cmd.workspace = true
deslop-core = { path = "../deslop-core", features = ["live", "test-support"] }
deslop-test-support = { path = "../deslop-test-support" }
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

# [CI-RELEASE-BUILD] [TEST-ONE-BINARY] `tcp_transport` stays its own test
# target rather than a module of `suite`, because CI addresses it by target
# name: `.github/workflows/ci.yml`'s Windows leg runs it with LLVM coverage,
# the only place this Windows-only suite executes. Folding it into the
# suite made that a hard `no test target named` error. Selecting it out of
# the suite by test-name filter is not an option — a filter that matches
# nothing exits 0, so a rename would silently stop running it (gh #412).
[[test]]
name = "tcp_transport"
path = "tests/tcp_transport.rs"
